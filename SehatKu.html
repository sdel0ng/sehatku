/* =========================================================
   PET ASISTEN: DATA, SUASANA HATI, TIPS & TAMPILAN
   ========================================================= */
const petSvg = (species, opts) => PET_ART.render(species, opts);
const speciesInfo = id => PET_SPECIES.find(s => s.id === id) || null;
const safeSpecies = id => (speciesInfo(id) ? id : 'oyen');
const safeStage = id => (PET_STAGES.some(s => s.id === id) ? id : 'bayi');
const unlockedSpecies = level => PET_SPECIES.filter(s => s.level <= level);
const nextPetStage = level => PET_STAGES.find(s => s.level > level) || null;
function petStage(level) {
  let stage = PET_STAGES[0];
  for (const s of PET_STAGES) if (level >= s.level) stage = s;
  return stage;
}
function petName(id) {
  const sp = speciesInfo(id);
  return state.game.pet.names[id] || (sp ? sp.def : 'Pet');
}
// Pet aktif (null = belum adopsi). Jenis yang levelnya belum tercapai diganti pet yang sudah terbuka
function activePet(level = getStats().level.level) {
  const p = state.game.pet;
  let sp = speciesInfo(p.species);
  if (!sp) return null;
  if (sp.level > level) sp = unlockedSpecies(level).find(s => p.names[s.id]) || PET_SPECIES[0];
  return { id: sp.id, info: sp, name: petName(sp.id), stage: petStage(level), level };
}
function petPublic(level = getStats().level.level) {
  const pet = activePet(level);
  return pet ? { species: pet.id, name: pet.name, stage: pet.stage.id } : { species: '', name: '', stage: '' };
}
function petMood(stats) {
  const f = stats.today.f;
  const hour = new Date().getHours();
  if (hour >= 22 || hour < 5) return 'tidur';
  if (stats.today.m.allDone) return 'bangga';
  if (f.exercised) return 'semangat';
  if (!f.logged && hour >= 10) return 'kangen';
  if (hour >= 13 && f.tot.water < f.t.waterMl * 0.5) return 'haus';
  return 'senang';
}
function timeOfDay() {
  const h = new Date().getHours();
  if (h >= 5 && h < 10) return 'pagi';
  if (h >= 10 && h < 15) return 'siang';
  if (h >= 15 && h < 18) return 'sore';
  return 'malam';
}
// Sayur & buah yang dicatat hari ini masuk ke mangkuk pet
function todaysBowl() {
  const seen = [];
  for (const f of getDay(todayKey()).foods) {
    if (!VEGGIE_RE.test(f.name) && !FRUIT_RE.test(f.name)) continue;
    const emoji = foodEmoji(f);
    if (!seen.includes(emoji)) seen.push(emoji);
  }
  return seen.slice(0, 4);
}

// Tips asisten: kabar teman dulu, lalu hal yang paling perlu dikerjakan hari ini
function petTips(stats, pet) {
  const tips = [];
  const push = (text, label = '', action = '', attrs = '') => tips.push({ text, label, action, attrs });
  const f = stats.today.f;
  const today = todayKey();
  const hour = new Date().getHours();
  for (const v of activeVisitors().filter(v => !visitSeen(v))) {
    push(`${v.pet.name} milik @${socialName(v.from)} datang berkunjung bawa pesan buatmu! 💌`, 'Lihat tamu', 'tab', 'data-tab="pet"');
  }
  if (returnedLetter()) push(`${pet.name} sudah pulang bawa balasan dari @${socialName(returnedLetter().to)}! 💌`, 'Baca', 'tab', 'data-tab="pet"');
  for (const r of incomingRequests()) push(`@${socialName(r.from)} ingin berteman denganmu! 👋`, 'Lihat', 'tab', 'data-tab="pet"');
  for (const fr of unreadFriendships()) push(`Ada pesan baru dari @${socialName(otherOf(fr))} 💬`, 'Buka chat', 'chatOpen', `data-uid="${esc(otherOf(fr))}"`);
  const waiting = chestsWaiting(stats.level.level);
  if (waiting) push(`Psst… ada ${waiting} peti hadiah belum dibuka! 🎁`, 'Buka peti', 'openChest');
  if (stats.logAtRisk && stats.curLogStreak >= 1) {
    push(`Streak ${stats.curLogStreak} hari kita belum aman hari ini. Catat 1 makanan dulu, yuk! 🔥`, 'Catat makanan', 'tab', 'data-tab="makanan"');
  } else if (!f.logged && hour >= 5 && hour < 11) {
    push('Sudah sarapan? Catat biar aku ikut kenyang 😋', 'Catat sarapan', 'addToMeal', 'data-meal="sarapan"');
  } else if (!f.logged && hour >= 11) {
    push('Belum ada makanan tercatat hari ini. Aku kangen angka kalorimu 🥺', 'Catat makanan', 'tab', 'data-tab="makanan"');
  }
  if (hour >= 8 && hour < 22 && f.tot.water < f.t.waterMl) {
    const expected = f.t.waterMl * clamp((hour - 7) / 13, 0, 1);
    if (f.tot.water <= expected - GLASS_ML) {
      push(`Baru ${Math.floor(f.tot.water / GLASS_ML)} dari ${Math.ceil(f.t.waterMl / GLASS_ML)} gelas air hari ini. Minum segelas bareng aku? 💧`, '+1 gelas air', 'petWater');
    }
  }
  if (f.logged && f.over) {
    const extra = f.tot.kcal - f.budget;
    push(`Kalori hari ini lewat ${fmt(extra)} kkal. Jalan cepat ±${fmt(walkMinutes(extra, today))} menit, aku temani! 🚶`, 'Catat olahraga', 'tab', 'data-tab="aktivitas"');
  } else if (f.logged && hour >= 12) {
    const left = Math.round(f.budget - f.tot.kcal);
    if (left > 150) push(`Sisa jatah ${fmt(left)} kkal — setara ${equivalentText(left, today)}. Pilih yang bergizi, ya!`);
  }
  if (!f.exercised && hour >= 15 && hour < 21) push('Belum gerak hari ini. Jalan santai 10 menit juga dihitung, lho! 🏃', 'Catat olahraga', 'tab', 'data-tab="aktivitas"');
  const mission = stats.today.m.list.find(m => !m.done && !m.failed);
  if (mission && hour >= 8) push(`Misi tersisa: ${mission.label}. Sedikit lagi! 🎯`);
  const last = sortedWeights().slice(-1)[0];
  const sinceWeigh = last ? daysBetween(last.date, today) : 0;
  if (sinceWeigh >= 7) push(`Sudah ${sinceWeigh} hari belum timbang. Catat berat minggu ini? ⚖️`, 'Catat berat', 'tab', 'data-tab="berat"');

/* =========================================================
   GAME TANGKAP SAYUR (canvas)
   ========================================================= */
const arcade = {
  running: false, paused: false, raf: 0, last: 0, canvas: null, ctx: null, w: 600, h: 340,
  x: 0.5, target: null, items: [], pops: [], score: 0, lives: 3, combo: 0, time: 0, spawnIn: 0.5, flash: 0,
  result: null, keys: { left: false, right: false },
};
function arcadeCardInner() {
  const g = state.game.arcade;
  const dayXp = g.day === todayKey() ? g.dayXp : 0;
  const res = arcade.result;
  const overlay = res
    ? `<div class="ao-title">${res.best ? '🏆 Rekor baru!' : 'Permainan selesai!'}</div>
       <div class="ao-score">${fmt(res.score)} poin</div>
       <div class="small">${res.xp ? `+${res.xp} XP 🎉` : dayXp >= ARCADE_XP_CAP ? 'XP game hari ini sudah maksimal' : 'Kumpulkan 50 poin untuk 1 XP'}</div>
       <button type="button" class="btn primary mt" data-action="arcadeStart">Main lagi 🔄</button>`
    : `<div class="ao-title">Tangkap sayur, hindari gorengan!</div>
       <div class="ao-items">🥦 🥕 🍎 🐟 = poin · ⭐ = bonus · 🍤 🍩 🥤 = nyawa berkurang</div>
       <div class="small">Geser jari atau mouse, atau tombol ← →</div>
       <button type="button" class="btn primary mt" data-action="arcadeStart">▶️ Main</button>`;
  return `
    <div class="card-head"><h3>🕹️ Tangkap Sayur</h3><span class="pill">🏆 Rekor ${fmt(g.best)}</span></div>
    <div class="arcade-wrap">
      <canvas id="arcadeCanvas" class="arcade-canvas" aria-label="Game Tangkap Sayur"></canvas>
      <div class="arcade-overlay" id="arcadeOverlay">${overlay}</div>
    </div>
    <div class="quiz-foot"><span>50 poin = 1 XP · tangkap 5 beruntun untuk combo ×2</span><span>XP game hari ini: ${dayXp}/${ARCADE_XP_CAP}</span></div>`;
}
function arcadeResize() {
  const c = arcade.canvas;
  const rect = c.getBoundingClientRect();
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  arcade.w = rect.width || 600;
  arcade.h = rect.height || 340;
  c.width = Math.round(arcade.w * ratio);
  c.height = Math.round(arcade.h * ratio);
  arcade.ctx = c.getContext('2d');
  if (arcade.ctx) arcade.ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
}
function arcadeAttach() {
  const canvas = $('#arcadeCanvas');
  if (!canvas || canvas === arcade.canvas) return;
  cancelAnimationFrame(arcade.raf);
  Object.assign(arcade, { running: false, paused: false, canvas, items: [], pops: [], flash: 0 });
  arcadeResize();
  arcadeDraw();
}
function arcadeStart() {
  const canvas = $('#arcadeCanvas');
  if (!canvas) return;
  cancelAnimationFrame(arcade.raf);
  Object.assign(arcade, {
    running: true, paused: false, canvas, x: 0.5, target: null, items: [], pops: [], score: 0, lives: 3, combo: 0,
    time: 0, spawnIn: 0.5, flash: 0, result: null, keys: { left: false, right: false },
  });
  arcadeResize();
  $('#arcadeOverlay').hidden = true;
  arcade.last = performance.now();
  arcade.raf = requestAnimationFrame(arcadeFrame);
}
function arcadeFrame(now) {
  if (!arcade.running) return;
  if (!arcade.canvas || !arcade.canvas.isConnected) {
    arcade.running = false;
    return;
  }
  const dt = Math.min(0.05, Math.max(0, (now - arcade.last) / 1000));
  arcade.last = now;
  arcadeStep(dt);
  arcadeDraw();
  if (arcade.running) arcade.raf = requestAnimationFrame(arcadeFrame);
}
function arcadeSpawn() {
  const a = arcade;
  const roll = Math.random();
  const badChance = Math.min(0.45, 0.22 + a.time / 120);
  let item;
  if (roll < 0.05) item = { kind: 'star', emoji: '⭐', pts: 50 };
  else if (roll < 0.05 + badChance) item = { kind: 'bad', emoji: ARCADE_BAD[Math.floor(Math.random() * ARCADE_BAD.length)], pts: 0 };
  else {
    const [emoji, pts] = ARCADE_GOOD[Math.floor(Math.random() * ARCADE_GOOD.length)];
    item = { kind: 'good', emoji, pts };
  }
  item.x = 0.07 + Math.random() * 0.86;
  item.y = -0.06;
  item.vy = (0.26 + Math.random() * 0.14) * (1 + a.time / 40);
  a.items.push(item);
}
function arcadeStep(dt) {
  const a = arcade;
  if (!a.running) return;
  a.time += dt;
  a.flash = Math.max(0, a.flash - dt);
  const move = 1.1 * dt;
  if (a.keys.left) a.x -= move;
  if (a.keys.right) a.x += move;
  if (a.target != null) a.x += clamp(a.target - a.x, -move * 1.5, move * 1.5);
  a.x = clamp(a.x, 0.05, 0.95);
  a.spawnIn -= dt;
  if (a.spawnIn <= 0) {
    arcadeSpawn();
    a.spawnIn = Math.max(0.32, 0.85 - a.time / 70);
  }
  const falling = [];
  for (const it of a.items) {
    it.y += it.vy * dt;
    if (Math.abs(it.y - ARCADE_PLAYER_Y) < 0.07 && Math.abs(it.x - a.x) < 0.085) arcadeCatch(it);
    else if (it.y < 1.08) falling.push(it);
    else if (it.kind === 'good') a.combo = 0;
  }
  a.items = falling;
  a.pops = a.pops.filter(p => (p.ttl -= dt) > 0);
  if (a.lives <= 0) arcadeOver();
}
function arcadeCatch(it) {
  const a = arcade;
  if (it.kind === 'bad') {
    a.lives -= 1;
    a.combo = 0;
    a.flash = 0.35;
    a.pops.push({ x: it.x, y: ARCADE_PLAYER_Y - 0.12, text: '💥', ttl: 0.7 });
    playNotes([[196, 0]], 'square', 0.15, 0.06);
    return;
  }
  a.combo += 1;
  const mult = Math.min(3, 1 + Math.floor(a.combo / 5));
  const pts = it.pts * mult;
  a.score += pts;
  a.pops.push({ x: it.x, y: ARCADE_PLAYER_Y - 0.12, text: `+${pts}`, ttl: 0.7 });
  if (it.kind === 'star') playNotes([[880, 0], [1175, 0.08]], 'sine', 0.2, 0.1);
}
function arcadeOver() {
  const a = arcade;
  a.running = false;
  cancelAnimationFrame(a.raf);
  const g = state.game.arcade;
  const today = todayKey();
  if (g.day !== today) {
    g.day = today;
    g.dayXp = 0;
  }
  const xp = Math.max(0, Math.min(Math.floor(a.score / 50), ARCADE_XP_CAP - g.dayXp));
  g.dayXp += xp;
  g.xp += xp;
  g.played += 1;
  const best = a.score > g.best;
  if (best) g.best = a.score;
  a.result = { score: a.score, xp, best };
  save();
  const card = $('#arcadeCard');
  if (card) card.innerHTML = arcadeCardInner();
  arcadeAttach();
  updateGameChip();
}
function arcadePause() {
  if (!arcade.running) return;
  arcade.running = false;
  arcade.paused = true;
  cancelAnimationFrame(arcade.raf);
  const overlay = $('#arcadeOverlay');
  if (overlay) {
    overlay.innerHTML = '<div class="ao-title">⏸️ Dijeda</div><button type="button" class="btn primary mt" data-action="arcadeResume">▶️ Lanjut</button>';
    overlay.hidden = false;
  }
}
function arcadeResume() {
  if (!arcade.paused || !arcade.canvas || !arcade.canvas.isConnected) {
    arcadeStart();
    return;
  }
  arcade.paused = false;
  arcade.running = true;
  $('#arcadeOverlay').hidden = true;
  arcade.last = performance.now();
  arcade.raf = requestAnimationFrame(arcadeFrame);
}
function arcadeDraw() {
  const a = arcade;
  const ctx = a.ctx;
  if (!ctx) return;
  const { w, h } = a;
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0, '#d9f1ff');
  sky.addColorStop(1, '#f2fbe9');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#bfe8cf';
  ctx.fillRect(0, h * 0.93, w, h * 0.07);
  if (a.flash > 0) {
    ctx.fillStyle = `rgba(229, 72, 77, ${a.flash})`;
    ctx.fillRect(0, 0, w, h);
  }
  const size = Math.max(26, Math.min(42, w / 15));
  const emojiFont = px => `${Math.round(px)}px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = emojiFont(size);
  for (const it of a.items) ctx.fillText(it.emoji, it.x * w, it.y * h);
  const px = a.x * w;
  const py = ARCADE_PLAYER_Y * h;
  ctx.font = emojiFont(size * 1.35);
  ctx.fillText('🥦', px, py);
  const outfit = equippedOutfit();
  if (outfit) {
    ctx.font = emojiFont(size * 0.75);
    ctx.fillText(outfit.emoji, px, py - size * 0.85);
  }
  ctx.font = `800 ${Math.round(size * 0.5)}px "Segoe UI", system-ui, sans-serif`;
  for (const p of a.pops) {
    ctx.globalAlpha = Math.min(1, p.ttl / 0.5);
    ctx.fillStyle = '#0b6b50';
    ctx.fillText(p.text, p.x * w, (p.y - (0.7 - p.ttl) * 0.12) * h);
  }
  ctx.globalAlpha = 1;
  if (!a.running && !a.paused) return;
  ctx.fillStyle = '#17251f';
  ctx.textAlign = 'left';
  ctx.font = `800 ${Math.round(size * 0.5)}px "Segoe UI", system-ui, sans-serif`;
  ctx.fillText(`Skor ${a.score}`, 12, 20);
  ctx.textAlign = 'right';
  ctx.font = emojiFont(size * 0.5);
  ctx.fillText('❤️'.repeat(Math.max(0, a.lives)) + '🖤'.repeat(3 - Math.max(0, a.lives)), w - 10, 20);
  if (a.combo >= 5) {
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e8590c';
    ctx.font = `800 ${Math.round(size * 0.5)}px "Segoe UI", system-ui, sans-serif`;
    ctx.fillText(`Combo ×${Math.min(3, 1 + Math.floor(a.combo / 5))}!`, w / 2, 20);
  }
}

function download(filename, content, type) {
  if (androidApp) {
    // Aplikasi Android: buka dialog simpan file bawaan HP
    androidApp.saveFile(filename, String(content), type);
    return;
  }
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
function exportCsv() {
  const decimalComma = (1.5).toLocaleString().includes(',');
  const sep = decimalComma ? ';' : ',';
  const n = (v, d = 0) => roundedValue(v, d).toFixed(d).replace('.', decimalComma ? ',' : '.');
  const cell = v => {
    const s = String(v);
    return s.includes(sep) || /["\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const rows = [['Tanggal', 'Waktu makan', 'Makanan', 'Porsi', 'Jumlah porsi', 'Kalori (kkal)', 'Protein (g)', 'Karbohidrat (g)', 'Lemak (g)']];
  for (const k of Object.keys(state.days).sort()) {
    for (const f of state.days[k].foods) {
      rows.push([k, mealLabel(f.meal), f.name, f.portion, n(f.qty, 2), n(f.kcal * f.qty), n(f.protein * f.qty, 1), n(f.carbs * f.qty, 1), n(f.fat * f.qty, 1)]);
    }
  }
  if (rows.length === 1) return toast('Belum ada catatan makanan untuk diexport', 'error');
  const csv = rows.map(r => r.map(cell).join(sep)).join('\r\n');
  download(`sehatku-log-makanan-${todayKey()}.csv`, '\ufeff' + csv, 'text/csv;charset=utf-8');
  return toast(`${rows.length - 1} baris diexport ✓`);
}
function importBackup(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(String(reader.result));
      if (!data || typeof data !== 'object' || !data.profile || !data.days) throw new Error('file ini bukan backup SehatKu');
      if (!confirm('Ganti semua data di aplikasi dengan isi backup ini?')) return;
      state = normalizeState(data);
      dataVersion += 1;
      checkProgress(true);
      save();
      render();
      toast('Backup berhasil dipulihkan ✓');
    } catch (err) {
      toast('Gagal import: ' + err.message, 'error');
    } finally {
      input.value = '';
    }
  };
  reader.onerror = () => toast('File tidak bisa dibaca', 'error');
  reader.readAsText(file);
}

/* =========================================================
   PEMBARUAN APLIKASI (cek version.json di GitHub Pages)
   ========================================================= */
const updater = {
  status: 'idle',      // idle | checking | latest | available | error
  latest: null,        // { version, date, notes } dari version.json
  checkedAt: 0,
  hosted: () => /^https?:$/.test(location.protocol),
  navigate: url => location.replace(url),
};
function compareVersions(a, b) {
  const pa = String(a).split('.').map(n => parseInt(n, 10) || 0);
  const pb = String(b).split('.').map(n => parseInt(n, 10) || 0);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
    const diff = (pa[i] || 0) - (pb[i] || 0);
    if (diff) return diff > 0 ? 1 : -1;
  }
  return 0;
}
function parseRelease(data) {
  if (!data || typeof data !== 'object' || !/^\d+(\.\d+){0,3}$/.test(String(data.version || ''))) return null;
  return {
    version: String(data.version),
    date: isDateKey(data.date) ? data.date : '',
    notes: (Array.isArray(data.notes) ? data.notes : []).slice(0, 8).map(n => String(n).slice(0, 160)),
    apk: Number.isInteger(data.apk) && data.apk > 0 ? data.apk : 0,
  };
}
function androidInfo() {
  try {
    return JSON.parse(androidApp.info());
  } catch (e) {
    return {};
  }
}
function apkUpdateHtml() {
  const release = updater.latest;
  if (!androidApp || !release || !release.apk || release.apk <= (androidInfo().code || 0)) return '';
  return `<p class="small">📱 Versi aplikasi Android baru tersedia. <a href="${ANDROID_APK_URL}">Unduh APK terbaru</a></p>`;
}
function androidCardHtml() {
  const onAndroid = /Android/i.test(navigator.userAgent);
  return `
    <div class="card">
      <h3>📱 Aplikasi Android</h3>
      <p class="small">${onAndroid ? 'Pasang SehatKu sebagai aplikasi di HP ini — buka langsung dari layar utama dan tetap jalan tanpa internet.' : 'SehatKu juga tersedia sebagai aplikasi Android (APK). Buka halaman ini di HP Android untuk memasangnya.'}</p>
      <div class="row wrap gap-s"><a class="btn small primary" href="${ANDROID_APK_URL}">⬇️ Unduh APK</a></div>
      <p class="tiny muted">Gratis, tanpa iklan. Saat memasang, izinkan “instal dari sumber ini”. Catatan di browser tidak otomatis pindah ke aplikasi — pindahkan lewat Export/Import backup.</p>
    </div>`;
}
// Dipanggil dari aplikasi Android setelah menyimpan file / gagal mengunduh pembaruan
window.sehatkuNotify = message => toast(String(message || ''));
window.sehatkuUpdateFailed = () => toast('Gagal mengunduh pembaruan — coba lagi saat online', 'error');
const updateAvailable = () => Boolean(updater.latest && compareVersions(updater.latest.version, APP_VERSION) > 0);

async function checkForUpdate(manual = false) {
  if (updater.status === 'checking') return;
  if (!manual && navigator.onLine === false) return;
  updater.status = 'checking';
  refreshUpdateUi();
  try {
    // ?t=… + no-store melewati cache GitHub Pages (10 menit) dan cache browser
    const response = await fetch(`${UPDATE_BASE}version.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const release = parseRelease(await response.json());
    if (!release) throw new Error('version.json tidak dikenali');
    updater.latest = release;
    updater.status = updateAvailable() ? 'available' : 'latest';
    if (manual) toast(updater.status === 'available' ? `Versi ${release.version} tersedia 🎉` : `Sudah versi terbaru (${APP_VERSION}) ✓`);
  } catch (err) {
    updater.status = updateAvailable() ? 'available' : 'error';
    if (manual) toast('Gagal cek pembaruan — pastikan internet tersambung', 'error');
  }
  updater.checkedAt = Date.now();
  refreshUpdateUi();
}

function updateSnoozed(version) {
  try {
    const snooze = JSON.parse(localStorage.getItem(UPDATE_SNOOZE_KEY) || 'null');
    return Boolean(snooze && snooze.version === version && Date.now() - snooze.at < 24 * 60 * 60 * 1000);
  } catch (e) {
    return false;
  }
}
function updateNotesHtml(release) {
  return release.notes.length ? `<ul class="small update-notes">${release.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>` : '';
}
function renderUpdateBanner() {
  const el = $('#updateBanner');
  if (!el) return;
  const release = updater.latest;
  const show = updater.status === 'available' && release && !updateSnoozed(release.version);
  el.hidden = !show;
  el.innerHTML = show
    ? `<span>🆕 <b>SehatKu ${esc(release.version)}</b> sudah tersedia${release.notes[0] ? ` — ${esc(release.notes[0])}` : ''}</span>
      <span class="ub-actions">
        <button type="button" class="btn small" data-action="updateInfo">Apa yang baru?</button>
        <button type="button" class="btn small primary" data-action="applyUpdate">🔄 Perbarui</button>
        <button type="button" class="x-btn" data-action="snoozeUpdate" title="Nanti saja" aria-label="Nanti saja">×</button>
      </span>`

// Sidik data yang stabil (urutan kunci tidak berpengaruh)
function stableStringify(value) {
  if (Array.isArray(value)) return '[' + value.map(stableStringify).join(',') + ']';
  if (value && typeof value === 'object') {
    return '{' + Object.keys(value).filter(k => value[k] !== undefined).sort()
      .map(k => JSON.stringify(k) + ':' + stableStringify(value[k])).join(',') + '}';
  }
  return JSON.stringify(value === undefined ? null : value);
}
function stateHash(s) {
  const text = stableStringify(s);
  return hashString(text).toString(36) + '.' + text.length.toString(36);
}
function isEmptyState(s) {
  const busy = Object.values(s.days || {}).some(d => d.foods.length || d.exercises.length || d.waterMl > 0 || d.steps != null || d.sleepH != null);
  return !busy && (s.weights || []).length <= 1 && !(s.customFoods || []).length;
}
// Pecah teks ke beberapa dokumen tanpa memotong emoji (pasangan surrogate)
function splitChunks(text) {
  const parts = [];
  let i = 0;
  while (i < text.length) {
    let end = Math.min(text.length, i + SYNC_CHUNK);
    const code = text.charCodeAt(end - 1);
    if (end < text.length && code >= 0xd800 && code <= 0xdbff) end -= 1;
    parts.push(text.slice(i, end));
    i = end;
  }
  return parts.length ? parts : [''];
}

// Gabungkan dua salinan data tanpa kehilangan catatan; penghapusan tetap berlaku
function mergeGame(a, b) {
  const g = JSON.parse(JSON.stringify(a));
  for (const [id, date] of Object.entries(b.unlocked)) {
    if (!g.unlocked[id] || date < g.unlocked[id]) g.unlocked[id] = date;
  }
  Object.assign(g.perfect, b.perfect);
  for (const [week, id] of Object.entries(b.bosses)) {
    if (!g.bosses[week]) g.bosses[week] = id;
  }
  g.level = Math.max(a.level, b.level);
  g.introSeen = a.introSeen || b.introSeen;
  if (compareVersions(b.news || '0', g.news || '0') > 0) g.news = b.news;
  const qa = a.quiz;
  const qb = b.quiz;
  g.quiz = {
    best: Math.max(qa.best, qb.best),
    played: Math.max(qa.played, qb.played),
    correct: Math.max(qa.correct, qb.correct),
    xp: Math.max(qa.xp, qb.xp),
    day: qa.day >= qb.day ? qa.day : qb.day,
    dayXp: qa.day === qb.day ? Math.max(qa.dayXp, qb.dayXp) : qa.day > qb.day ? qa.dayXp : qb.dayXp,
  };
  const ra = a.rewards;
  const rb = b.rewards;
  Object.assign(g.rewards, {
    opened: Math.max(ra.opened, rb.opened),
    stars: Math.max(ra.stars, rb.stars),
    redeemed: Math.max(ra.redeemed, rb.redeemed),
  });
  for (const [id, n] of Object.entries(rb.stickers)) g.rewards.stickers[id] = Math.max(n, ra.stickers[id] || 0);
  const aa = a.arcade;
  const ab = b.arcade;
  g.arcade = {
    best: Math.max(aa.best, ab.best),
    played: Math.max(aa.played, ab.played),
    xp: Math.max(aa.xp, ab.xp),
    day: aa.day >= ab.day ? aa.day : ab.day,
    dayXp: aa.day === ab.day ? Math.max(aa.dayXp, ab.dayXp) : aa.day > ab.day ? aa.dayXp : ab.dayXp,
  };
  // Pet: pilihan terbaru menang, nama dari kedua perangkat digabung
  const pa = a.pet;
  const pb = b.pet;
  const [older, newer] = (pb.updatedAt || 0) > (pa.updatedAt || 0) ? [pa, pb] : [pb, pa];
  const adopted = [pa.adopted, pb.adopted].filter(Boolean).sort()[0] || '';
  g.pet = {
    species: newer.species || older.species,
    names: { ...older.names, ...newer.names },
    adopted,
    pats: Math.max(pa.pats, pb.pats),
    updatedAt: Math.max(pa.updatedAt || 0, pb.updatedAt || 0),
  };
  return g;
}
function mergeStates(a, b) {
  const deleted = { ...b.deleted };
  for (const [id, at] of Object.entries(a.deleted)) deleted[id] = Math.max(at, deleted[id] || 0);
  const alive = item => !deleted[item.id];
  const unionById = (first, second) => {
    const seen = new Set(first.map(x => x.id));
    return first.concat(second.filter(x => !seen.has(x.id))).filter(alive);
  };
  const days = {};
  for (const k of new Set([...Object.keys(a.days), ...Object.keys(b.days)])) {
    const da = a.days[k];
    const db = b.days[k];
    if (!da || !db) {
      const d = da || db;
      days[k] = { ...d, foods: d.foods.filter(alive), exercises: d.exercises.filter(alive) };
      continue;
    }
    days[k] = {
      foods: unionById(da.foods, db.foods),
      exercises: unionById(da.exercises, db.exercises),
      waterMl: Math.max(da.waterMl || 0, db.waterMl || 0),
      steps: da.steps != null && db.steps != null ? Math.max(da.steps, db.steps) : da.steps != null ? da.steps : db.steps,
      sleepH: da.sleepH != null ? da.sleepH : db.sleepH,
    };
  }
  // Satu data berat per tanggal: pakai yang dibuat paling akhir (id diawali waktu pembuatan)
  const byDate = {};
  for (const w of unionById(a.weights, b.weights)) {
    if (!byDate[w.date] || w.id > byDate[w.date].id) byDate[w.date] = w;
  }
  return normalizeState({
    version: 1,
    createdAt: a.createdAt < b.createdAt ? a.createdAt : b.createdAt,
    profile: (b.profile.updatedAt || 0) > (a.profile.updatedAt || 0) ? b.profile : a.profile,
    days,
    weights: Object.values(byDate),
    customFoods: unionById(a.customFoods, b.customFoods),
    deleted,
    game: mergeGame(a.game, b.game),
  });
}

function syncMeta() {

function setSyncMeta(patch) {

// Adapter Firebase: users/{uid} = info revisi, users/{uid}/chunks/{n} = potongan data JSON
function firebaseAdapter(config) {
  let fb = null;
  const userInfo = u => (u ? { uid: u.uid, email: u.email || '', name: u.displayName || '' } : null);
  const rootRef = id => fb.f.doc(fb.db, 'users', id);
  const chunkRef = (id, i) => fb.f.doc(fb.db, 'users', id, 'chunks', String(i));
  return {
    async init(onUser) {
      const [appM, authM, fsM] = await Promise.all(
        ['firebase-app.js', 'firebase-auth.js', 'firebase-firestore.js'].map(m => import(FIREBASE_SDK + m)),
      );
      const app = appM.initializeApp(config);
      fb = { auth: authM.getAuth(app), db: fsM.getFirestore(app), a: authM, f: fsM };
      await new Promise(resolve => {
        let first = true;
        authM.onAuthStateChanged(fb.auth, user => {
          onUser(userInfo(user));
          if (first) {
            first = false;
            resolve();
          }
        });
      });
    },
    signInGoogle: () => fb.a.signInWithPopup(fb.auth, new fb.a.GoogleAuthProvider()),
    signInEmail: (email, password) => fb.a.signInWithEmailAndPassword(fb.auth, email, password),
    signUpEmail: (email, password) => fb.a.createUserWithEmailAndPassword(fb.auth, email, password),
    resetPassword: email => fb.a.sendPasswordResetEmail(fb.auth, email),
    signOut: () => fb.a.signOut(fb.auth),
    deleteUser: () => fb.a.deleteUser(fb.auth.currentUser),
    async pullMeta(id) {
      const snap = await fb.f.getDoc(rootRef(id));
      return snap.exists() ? snap.data() : null;
    },
    async pullData(id, meta) {
      const snaps = await Promise.all(Array.from({ length: meta.chunks || 0 }, (_, i) => fb.f.getDoc(chunkRef(id, i))));
      return snaps.map(s => (s.exists() ? s.data().d : '')).join('');
    },
    push(id, text, expectedRev, meta) {
      const parts = splitChunks(text);
      return fb.f.runTransaction(fb.db, async tx => {
        const snap = await tx.get(rootRef(id));
        const current = snap.exists() ? snap.data() : null;
        if ((current ? current.rev : null) !== expectedRev) {
          throw Object.assign(new Error('Data akun berubah dari perangkat lain'), { code: 'sync/conflict' });
        }
        parts.forEach((d, i) => tx.set(chunkRef(id, i), { d }));
        for (let i = parts.length; i < (current ? current.chunks || 0 : 0); i++) tx.delete(chunkRef(id, i));
        tx.set(rootRef(id), { ...meta, chunks: parts.length });
      });
    },
    async remove(id) {
      const meta = await this.pullMeta(id);
      const batch = fb.f.writeBatch(fb.db);
      for (let i = 0; i < (meta ? meta.chunks || 0 : 0); i++) batch.delete(chunkRef(id, i));
      batch.delete(rootRef(id));
      await batch.commit();
    },
    social: firestoreSocial(() => fb),
  };
}

// Teman, chat & kunjungan pet di Firestore. Waktu dari server diubah ke milidetik supaya mudah dipakai.
function firestoreSocial(getFb) {
  const F = () => getFb().f;
  const db = () => getFb().db;
  const ms = v => (v && typeof v.toMillis === 'function' ? v.toMillis() : 0);
  const read = s => s.data({ serverTimestamps: 'estimate' });
  const emptyPet = { species: '', name: '', stage: '' };
  const profileOf = s => {
    const d = read(s);
    return {
      uid: s.id, username: d.username, name: d.name || '', level: d.level || 1, streak: d.streak || 0, badges: d.badges || 0,
      pet: d.pet || emptyPet, lastSeen: ms(d.lastSeen), updatedAt: ms(d.updatedAt),
    };
  };
  const friendshipOf = s => {
    const d = read(s);
    const seen = {};
    for (const [k, v] of Object.entries(d.read || {})) seen[k] = ms(v);
    return {
      id: s.id, members: d.members || [], from: d.from, to: d.to, status: d.status, createdAt: ms(d.createdAt),
      acceptedAt: ms(d.acceptedAt), lastMsg: d.lastMsg || null, lastAt: ms(d.lastAt), read: seen,
    };
  };
  const messageOf = s => {
    const d = read(s);
    return { id: s.id, from: d.from, text: d.text || '', kind: d.kind || 'text', at: ms(d.at), pet: d.pet || null, gift: d.gift || '', pending: s.metadata.hasPendingWrites };
  };
  const visitOf = s => {
    const d = read(s);
    return {
      id: s.id, from: d.from, to: d.to, pairId: d.pairId, pet: d.pet || emptyPet, note: d.note || '', gift: d.gift || '', at: ms(d.at),
      status: d.status, reply: d.reply || '', replyGift: d.replyGift || '', returnedAt: ms(d.returnedAt),
    };
  };
  const ref = (...path) => F().doc(db(), ...path);
  const newMessageRef = id => F().doc(F().collection(db(), 'chats', id, 'messages'));
  const pairOf = (a, b) => [a, b].sort().join('_');
  const lastMsg = (uid, msg) => ({ lastMsg: { from: uid, text: cutText(msg.text, 100), kind: msg.kind }, lastAt: F().serverTimestamp() });
  const messageDoc = (uid, msg) => {
    const out = { from: uid, text: msg.text, kind: msg.kind, at: F().serverTimestamp() };
    if (msg.pet) out.pet = msg.pet;
    if (msg.gift !== undefined) out.gift = msg.gift;
    return out;
  };
  async function clearChat(id) {
    for (let round = 0; round < 25; round++) {
      const snap = await F().getDocs(F().query(F().collection(db(), 'chats', id, 'messages'), F().limit(400)));
      if (snap.empty) return;
      const batch = F().writeBatch(db());
      snap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
      if (snap.size < 400) return;
    }
  }
  const api = {
    async getProfile(uid) {
      const s = await F().getDoc(ref('profiles', uid));
      return s.exists() ? profileOf(s) : null;
    },
    async usernameOwner(name) {
      const s = await F().getDoc(ref('usernames', name));
      return s.exists() ? s.data().uid : null;
    },
    // Profil + username ditulis bersamaan; username lama dilepas saat diganti
    async saveProfile(uid, profile, oldUsername) {
      const batch = F().writeBatch(db());
      batch.set(ref('profiles', uid), { ...profile, lastSeen: F().serverTimestamp(), updatedAt: F().serverTimestamp() });
      if (profile.username !== oldUsername) {
        batch.set(ref('usernames', profile.username), { uid });
        if (oldUsername) batch.delete(ref('usernames', oldUsername));
      }
      await batch.commit();
    },
    publish: (uid, fields) => F().updateDoc(ref('profiles', uid), { ...fields, lastSeen: F().serverTimestamp(), updatedAt: F().serverTimestamp() }),
    touch: uid => F().updateDoc(ref('profiles', uid), { lastSeen: F().serverTimestamp() }),
    async search(prefix) {
      const q = F().query(F().collection(db(), 'profiles'), F().orderBy('username'), F().startAt(prefix), F().endAt(prefix + '\uf8ff'), F().limit(10));
      return (await F().getDocs(q)).docs.map(profileOf);
    },
    watchFriendships: (uid, cb, onError) => F().onSnapshot(
      F().query(F().collection(db(), 'friendships'), F().where('members', 'array-contains', uid)),
      snap => cb(snap.docs.map(friendshipOf)), onError),
    requestFriend: (uid, other) => F().setDoc(ref('friendships', pairOf(uid, other)), {
      members: [uid, other].sort(), from: uid, to: other, status: 'pending', createdAt: F().serverTimestamp(), read: {},
    }),
    acceptFriend: id => F().updateDoc(ref('friendships', id), { status: 'accepted', acceptedAt: F().serverTimestamp() }),
    async removeFriend(id, withChat) {
      if (withChat) await clearChat(id);
      await F().deleteDoc(ref('friendships', id));
    },
    markRead: (id, uid) => F().updateDoc(ref('friendships', id), { ['read.' + uid]: F().serverTimestamp() }),
    watchMessages: (id, cb, onError) => F().onSnapshot(
      F().query(F().collection(db(), 'chats', id, 'messages'), F().orderBy('at', 'desc'), F().limit(CHAT_LIMIT)),
      { includeMetadataChanges: true },
      snap => cb(snap.docs.map(messageOf).reverse()), onError),
    sendMessage(id, uid, msg) {
      const batch = F().writeBatch(db());
      batch.set(newMessageRef(id), messageDoc(uid, msg));
      batch.update(ref('friendships', id), lastMsg(uid, msg));
      return batch.commit();
    },
    watchVisitors: (uid, cb, onError) => F().onSnapshot(
      F().query(F().collection(db(), 'visits'), F().where('to', '==', uid)),
      snap => cb(snap.docs.map(visitOf)), onError),
    watchMyVisit: (uid, cb, onError) => F().onSnapshot(ref('visits', uid), s => cb(s.exists() ? visitOf(s) : null), onError),
    sendVisit(uid, to, pet, note, gift) {
      const id = pairOf(uid, to);
      const msg = { text: note, kind: 'visit', pet, gift };
      const batch = F().writeBatch(db());
      batch.set(ref('visits', uid), {
        from: uid, to, pairId: id, pet, note, gift, at: F().serverTimestamp(), status: 'visiting', reply: '', replyGift: '', returnedAt: null,
      });
      batch.set(newMessageRef(id), messageDoc(uid, msg));
      batch.update(ref('friendships', id), lastMsg(uid, { ...msg, text: note || `🐾 ${pet.name} datang berkunjung` }));
      return batch.commit();
    },
    sendHome(uid, visit, reply, gift, stillFriends) {
      const batch = F().writeBatch(db());
      batch.update(ref('visits', visit.from), { status: 'home', reply, replyGift: gift, returnedAt: F().serverTimestamp() });
      if (stillFriends) {
        const msg = { text: reply, kind: 'return', pet: visit.pet, gift };
        batch.set(newMessageRef(visit.pairId), messageDoc(uid, msg));
        batch.update(ref('friendships', visit.pairId), lastMsg(uid, { ...msg, text: reply || `🐾 ${visit.pet.name} diantar pulang` }));
      }
      return batch.commit();
    },
    recallVisit: uid => F().updateDoc(ref('visits', uid), { status: 'home', returnedAt: F().serverTimestamp() }),
    watchBlocks: (uid, cb, onError) => F().onSnapshot(
      F().query(F().collection(db(), 'blocks'), F().where('blocker', '==', uid)),
      snap => cb(snap.docs.map(d => d.data().blocked)), onError),
    block: (uid, other) => F().setDoc(ref('blocks', uid + '_' + other), { blocker: uid, blocked: other, at: F().serverTimestamp() }),
    unblock: (uid, other) => F().deleteDoc(ref('blocks', uid + '_' + other)),
    // Hapus akun: pertemanan + chat, blokir, kunjungan, profil & username
    async removeAll(uid) {
      const friends = await F().getDocs(F().query(F().collection(db(), 'friendships'), F().where('members', 'array-contains', uid)));
      for (const d of friends.docs) await api.removeFriend(d.id, true);
      const blocks = await F().getDocs(F().query(F().collection(db(), 'blocks'), F().where('blocker', '==', uid)));
      const profile = await api.getProfile(uid);
      const batch = F().writeBatch(db());
      blocks.docs.forEach(d => batch.delete(d.ref));
      batch.delete(ref('visits', uid));
      batch.delete(ref('profiles', uid));
      if (profile && profile.username) batch.delete(ref('usernames', profile.username));
      await batch.commit();
    },
  };
  return api;
}

function cloudErrorText(err) {
  const code = (err && err.code) || '';
  if (['auth/popup-closed-by-user', 'auth/cancelled-popup-request', 'sync/cancelled'].includes(code)) return '';
  const messages = {
    'auth/invalid-credential': 'Email atau password salah.',
    'auth/wrong-password': 'Email atau password salah.',
    'auth/user-not-found': 'Email ini belum terdaftar — pilih Daftar baru.',

function cloudBoot() {
  if (!CLOUD_CONFIG) return;
  cloud.api = firebaseAdapter(CLOUD_CONFIG);

  if (syncMeta().uid) cloudInit();

function cloudInit() {
  if (!cloud.api) return Promise.resolve(false);
  if (cloud.ready) return Promise.resolve(true);
  if (cloud.initPromise) return cloud.initPromise;
  cloud.status = 'loading';
  cloud.error = '';
  renderCloudUi();
  cloud.initPromise = cloud.api.init(onCloudUser)
    .then(() => {
      cloud.ready = true;
      if (!cloud.user) cloud.status = 'signedOut';
      renderCloudUi();
      return true;
    })
    .catch(err => {
      cloud.initPromise = null;
      cloud.status = navigator.onLine === false ? 'offline' : 'error';
      cloud.error = 'Layanan akun tidak bisa dimuat. Cek koneksi internet, lalu coba lagi.';
      renderCloudUi();
      return false;
    });
  return cloud.initPromise;
}
function onCloudUser(user) {
  const previous = cloud.user;
  cloud.user = user;
  if (!user) {
    socialStop();
    cloud.status = 'signedOut';
    renderCloudUi();
    renderSocial();
    return;
  }
  if (!previous || previous.uid !== user.uid) {
    syncNow();
    socialStart();
  } else {
    renderCloudUi();
  }
}

function scheduleSync(delay = 4000) {
  if (!cloud.user) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncNow, delay);
}
function syncNow() {
  if (!cloud.user || !cloud.api) return Promise.resolve();
  if (syncPromise) {
    syncAgain = true;
    return syncPromise;
  }
  clearTimeout(syncTimer);
  cloud.status = 'syncing';
  renderCloudUi();
  syncPromise = (async () => {
    try {
      for (let attempt = 0; ; attempt++) {
        try {
          await runSync();
          break;
        } catch (err) {
          // Perangkat lain menyimpan duluan → tarik, gabungkan, coba lagi
          if (err.code !== 'sync/conflict' || attempt >= 2) throw err;
        }
      }
      if (cloud.user) {
        cloud.status = 'synced';
        cloud.syncedAt = Date.now();
        cloud.error = '';
      }
    } catch (err) {
      if (err.code === 'sync/cancelled') {
        cloud.status = 'signedOut';
        cloud.error = '';
      } else {
        cloud.status = navigator.onLine === false ? 'offline' : 'error';
        cloud.error = cloudErrorText(err);
      }
    } finally {
      syncPromise = null;
      renderCloudUi();
      if (syncAgain) {
        syncAgain = false;
        scheduleSync(1500);
      }
    }
  })();
  return syncPromise;
}
async function runSync() {
  const user = cloud.user;
  const meta = syncMeta();
  const firstLink = meta.uid !== user.uid;
  const remote = await cloud.api.pullMeta(user.uid);
  if (!cloud.user || cloud.user.uid !== user.uid) return;
  const localChanged = firstLink || stateHash(state) !== meta.lastHash;
  let rev = remote ? remote.rev : null;
  if (remote && (firstLink || remote.rev !== meta.lastRev)) {
    const text = await cloud.api.pullData(user.uid, remote);
    if (text.length !== remote.size) throw Object.assign(new Error('Data akun tidak lengkap'), { code: 'sync/partial' });
    const remoteState = normalizeState(JSON.parse(text));
    let choice = 'merge';
    if (!localChanged || (firstLink && isEmptyState(state))) choice = 'cloud';
    else if (firstLink && isEmptyState(remoteState)) choice = 'local';
    else if (firstLink) choice = await askLinkChoice(user);
    if (choice === 'cancel') {
      await cloud.api.signOut();
      cloud.user = null;
      toast('Masuk dibatalkan — catatan di perangkat ini tidak diubah');
      throw Object.assign(new Error('dibatalkan'), { code: 'sync/cancelled' });
    }
    if (choice === 'cloud') {
      adoptState(remoteState);
    } else {
      if (choice === 'merge') adoptState(mergeStates(state, remoteState));
      rev = await pushState(user.uid, rev);
    }
  } else if (!remote || localChanged) {
    rev = await pushState(user.uid, rev);
  }
  setSyncMeta({ uid: user.uid, lastRev: rev, lastHash: stateHash(state) });
}
async function pushState(id, expectedRev) {
  const rev = 'r' + uid();

  return rev;
}
function adoptState(next) {

}

  friendships: [],

let searchTimer = null;
const socialApi = () => (cloud.api && cloud.api.social) || null;

const acceptedFriends = () => social.friendships.filter(f => f.status === 'accepted');

const unreadFriendships = () => (socialReady() ? acceptedFriends().filter(isUnread) : []);

const activeVisitors = () => (socialReady() ? social.visitors.filter(visitActive) : []);

// Potong teks per karakter utuh (emoji tidak terbelah), dihitung dalam satuan UTF-16 seperti aturan Firestore
function cutText(v, max) {
  let out = '';

    if (out.length + ch.length > max) break;
    out += ch;
  }
  return out;
}

const clockText = t => new Date(t).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
function agoText(t) {
  const min = Math.floor(Math.max(0, Date.now() - t) / 60000);
  if (min < 1) return 'baru saja';
  if (min < 60) return `${min} menit lalu`;
  const hours = Math.floor(min / 60);
  if (hours < 24) return `${hours} jam lalu`;
  const days = Math.floor(hours / 24);
  if (days === 1) return 'kemarin';
  if (days < 30) return `${days} hari lalu`;
  return new Date(t).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}

// Tanda "sudah dilihat" untuk tamu & surat balasan (per perangkat)

}

  try {

  } catch (e) {
    /* penyimpanan tidak tersedia */

  return next;
}
const visitSeen = v => (socialSeen().visits || {})[v.from] === v.at;
function markVisitorsSeen() {
  const list = activeVisitors();
  if (!list.length) return;
  const visits = { ...(socialSeen().visits || {}) };
  let changed = false;
  for (const v of list) {
    if (visits[v.from] !== v.at) {

}
function returnedLetter() {
  const v = socialReady() ? social.myVisit : null;
  if (!v || v.status !== 'home' || !v.returnedAt || (!v.reply && !giftOk(v.replyGift))) return null;
  return socialSeen().letter === v.returnedAt ? null : v;
}

  if (!socialReady()) return 0;
  return incomingRequests().length + unreadFriendships().length
    + activeVisitors().filter(v => !visitSeen(v)).length + (returnedLetter() ? 1 : 0);

function socialErrorText(err, fallback = '') {
  const code = (err && err.code) || '';
  if (code === 'unavailable' || navigator.onLine === false) return 'Sedang offline — coba lagi saat online.';
  if (code === 'permission-denied') return fallback || 'Akses ditolak.';
  if (fallback) return fallback;
  return 'Terjadi kendala: ' + ((err && err.message) || 'tidak diketahui');
}
function suggestedUsername() {
  const source = (state.profile.name || (cloud.user && cloud.user.email ? cloud.user.email.split('@')[0] : '') || 'sehat').toLowerCase();
  let name = source.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9_.]/g, '');
  if (!/^[a-z]/.test(name)) name = 'sehat' + name;
  if (name.length < 3) name += 'ku';
  return name.slice(0, 20);
}

// ---------- Siklus hidup: mulai saat masuk akun, berhenti saat keluar ----------
async function socialStart(force = false) {
  const api = socialApi();
  const user = cloud.user;
  if (!api || !user) return;
  if (!force && social.uid === user.uid && ['loading', 'ready', 'needUsername'].includes(social.status)) return;
  socialStop();
  social.uid = user.uid;
  social.status = 'loading';
  renderSocial();
  try {
    const me = await api.getProfile(user.uid);
    if (!cloud.user || cloud.user.uid !== user.uid || social.uid !== user.uid) return;
    if (me) {
      social.me = me;
      social.profiles[me.uid] = { ...me, fetchedAt: Date.now() };
      socialListen();
    } else {
      social.status = 'needUsername';
    }
  } catch (err) {
    if (social.uid !== user.uid) return;
    social.status = 'error';
    social.error = socialErrorText(err, 'Data teman tidak bisa dimuat. Cek koneksi, lalu coba lagi.');
  }
  renderSocial();
}
function socialListen() {
  const api = socialApi();
  const uid = social.uid;
  social.status = 'ready';
  social.error = '';
  social.loaded = {};
  const onError = err => {
    if (social.uid !== uid) return;
    social.error = socialErrorText(err, 'Sebagian data teman gagal dimuat.');
    renderSocial();
  };
  social.unsubs.push(api.watchFriendships(uid, list => onFriendships(uid, list), onError));
  social.unsubs.push(api.watchVisitors(uid, list => onVisitors(uid, list), onError));
  social.unsubs.push(api.watchMyVisit(uid, visit => onMyVisit(uid, visit), onError));
  social.unsubs.push(api.watchBlocks(uid, list => {
    if (social.uid !== uid) return;
    social.blocks = list;
    fetchProfiles(list);
    renderSocial();
  }, onError));
  publishProfile(true);
  clearInterval(social.presenceTimer);
  social.presenceTimer = setInterval(socialTouch, PRESENCE_MS);
}
function socialStop() {
  social.unsubs.forEach(unsub => {
    try {
      unsub();
    } catch (e) {
      /* abaikan */
    }
  });
  closeChatListener();
  clearInterval(social.presenceTimer);
  clearTimeout(social.publishTimer);
  clearTimeout(searchTimer);
  Object.assign(social, {
    status: 'off', uid: null, me: null, error: '', friendships: [], profiles: {}, visitors: [], myVisit: null, blocks: [],
    unsubs: [], loaded: {}, fetching: {}, publishedSig: '', touchedAt: 0,
    search: { q: '', results: null, busy: false, seq: 0, error: '' },
  });

// Notifikasi kecil saat ada kabar baru (bukan saat data pertama dimuat)
function socialNotify(makeText) {
  setTimeout(() => {
    if (socialReady()) toast(makeText());
  }, 350);
}
function onFriendships(uid, list) {
  if (social.uid !== uid) return;
  const before = social.friendships;
  const first = !social.loaded.friendships;
  social.friendships = list;
  social.loaded.friendships = true;
  if (!first) {
    for (const f of list) {
      const old = before.find(x => x.id === f.id);
      const other = otherOf(f);
      if (f.status === 'pending' && f.to === uid && !old) socialNotify(() => `👋 @${socialName(other)} ingin berteman denganmu!`);
      if (f.status === 'accepted' && old && old.status === 'pending' && f.from === uid) socialNotify(() => `🎉 @${socialName(other)} menerima pertemananmu!`);
      if (f.status === 'accepted' && f.lastMsg && f.lastMsg.from !== uid && f.lastAt > ((old && old.lastAt) || 0) && !chatOpenWith(f)) {
        socialNotify(() => `💬 @${socialName(other)}: ${f.lastMsg.text}`);
      }
    }
  }
  fetchProfiles(list.map(otherOf));
  if (social.chat) markChatRead();
  renderSocial();
}
function onVisitors(uid, list) {
  if (social.uid !== uid) return;
  const before = social.visitors;
  const first = !social.loaded.visitors;
  social.visitors = list;
  social.loaded.visitors = true;
  if (!first) {
    for (const v of list) {
      const old = before.find(x => x.from === v.from);
      if (visitActive(v) && (!old || old.at !== v.at)) socialNotify(() => `🐾 ${v.pet.name} milik @${socialName(v.from)} datang berkunjung!`);
    }
  }
  if (ui.tab === 'pet') markVisitorsSeen();
  fetchProfiles(list.map(v => v.from));
  renderSocial();
}
function onMyVisit(uid, visit) {
  if (social.uid !== uid) return;
  const old = social.myVisit;
  const first = !social.loaded.myVisit;
  social.myVisit = visit;
  social.loaded.myVisit = true;
  if (!first && old && old.status === 'visiting' && visit && visit.status === 'home' && visit.at === old.at && (visit.reply || visit.replyGift)) {
    socialNotify(() => `💌 ${visit.pet.name} pulang bawa balasan dari @${socialName(visit.to)}!`);
  }
  if (visit) fetchProfiles([visit.to]);
  renderSocial();
}
async function fetchProfiles(uids, maxAge = 5 * 60000) {
  const api = socialApi();
  if (!api || !social.uid) return;
  const now = Date.now();
  const need = [...new Set(uids)].filter(u => u && u !== social.uid && !social.fetching[u]
    && (!social.profiles[u] || now - (social.profiles[u].fetchedAt || 0) > maxAge));
  if (!need.length) return;
  const uid = social.uid;
  need.forEach(u => {
    social.fetching[u] = true;
  });
  const results = await Promise.all(need.map(u => api.getProfile(u).catch(() => undefined)));
  if (social.uid !== uid) return;
  need.forEach((u, i) => {
    delete social.fetching[u];
    if (results[i]) social.profiles[u] = { ...results[i], fetchedAt: now };
    else if (results[i] === null || !social.profiles[u]) {
      social.profiles[u] = { uid: u, username: 'pengguna', name: '', level: 1, streak: 0, badges: 0, pet: { species: '', name: '', stage: '' }, lastSeen: 0, missing: true, fetchedAt: now };
    }
  });
  renderSocial();
}

function publicFields() {

  return {

    badges: stats.unlockedCount, pet: petPublic(stats.level.level),
  };
}
const publishSig = f => [f.name, f.level, f.streak, f.badges, f.pet.species, f.pet.name, f.pet.stage].join('|');
function publishProfile(force) {
  const api = socialApi();
  if (!socialReady() || !api || !social.me) return;
  const fields = publicFields();
  const sig = publishSig(fields);
  if (!force && sig === social.publishedSig) return;
  social.publishedSig = sig;
  social.touchedAt = Date.now();
  Object.assign(social.me, fields, { lastSeen: Date.now() });
  social.profiles[social.uid] = { ...social.me, fetchedAt: Date.now() };
  api.publish(social.uid, fields).catch(() => {
    social.publishedSig = '';
  });
}
function schedulePublish() {

function socialTouch() {

  social.touchedAt = Date.now();

async function runSearch() {
  const api = socialApi();
  const q = social.search.q.trim().toLowerCase().replace(/^@/, '');
  const seq = ++social.search.seq;
  social.search.error = '';
  if (!api || q.length < 2 || !/^[a-z0-9_.]+$/.test(q)) {
    social.search.results = q.length >= 2 ? [] : null;
    social.search.busy = false;
    renderSearchResults();
    return;
  }
  social.search.busy = true;
  renderSearchResults();
  try {
    const list = await api.search(q);
    if (seq !== social.search.seq) return;
    list.forEach(p => {
      if (p.uid !== social.uid) social.profiles[p.uid] = { ...p, fetchedAt: Date.now() };
    });
    social.search.results = list.filter(p => p.uid !== social.uid);
  } catch (err) {
    if (seq !== social.search.seq) return;
    social.search.results = null;
    social.search.error = socialErrorText(err, 'Pencarian gagal. Coba lagi sebentar.');
  }
  social.search.busy = false;
  renderSearchResults();
}

function renderChatList() {
  const list = $('#chatList');
  const chat = social.chat;
  if (!list || !chat) return;
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 90;
  if (!chat.messages.length) {
    list.innerHTML = `<div class="empty">Belum ada pesan. Sapa @${esc(socialName(chat.uid))} dulu! 👋</div>`;
    return;
  }
  let day = '';
  let html = '';
  for (const m of chat.messages) {
    const k = dateKey(new Date(m.at || Date.now()));
    if (k !== day) {
      day = k;
      html += `<div class="chat-day">${esc(chatDayLabel(k))}</div>`;
    }
    html += messageHtml(m);
  }
  list.innerHTML = html;
  if (nearBottom || !chat.scrolled) {
    list.scrollTop = list.scrollHeight;
    chat.scrolled = true;
  }
}
function markChatRead() {
  const chat = social.chat;
  const api = socialApi();
  if (!chat || !api) return;
  const f = social.friendships.find(x => x.id === chat.pairId);
  if (!f || !f.lastMsg || f.lastMsg.from === social.uid) return;
  if ((f.read[social.uid] || 0) >= f.lastAt || chat.readAt >= f.lastAt) return;
  chat.readAt = f.lastAt;
  api.markRead(f.id, social.uid).catch(() => {});
}
function sendChat(text, kind = 'text') {
  const chat = social.chat;
  const api = socialApi();
  const clean = cutText(text, 500);
  if (!chat || !api || !clean) return;
  api.sendMessage(chat.pairId, social.uid, { text: clean, kind }).catch(err => toast(socialErrorText(err, 'Pesan gagal terkirim — kalian masih berteman?'), 'error'));
}

    p.names[sp.id] = name;
    p.species = sp.id;
    if (!p.adopted) p.adopted = todayKey();
    p.updatedAt = Date.now();
    save();
    closeModal();
    render();
    if (first) {
      confetti();
      playChime();
      toast(`Selamat datang di rumah, ${name}! 🎉 ${name} akan menemanimu di Beranda.`);
    } else {
      toast(`${name} siap menemanimu 🐾`);
    }
  },
  username: async form => {
    const api = socialApi();
    if (!api || !cloud.user || !social.uid) return;
    const fd = new FormData(form);
    const username = String(fd.get('username') || '').trim().toLowerCase().replace(/^@/, '');
    const name = cutText(fd.get('name'), 30);
    if (!USERNAME_RE.test(username)) return toast('Username 3–20 karakter: huruf kecil, angka, titik atau _, diawali huruf.', 'error');
    const old = social.me ? social.me.username : '';
    const button = form.querySelector('.btn.primary');
    if (button) button.disabled = true;
    try {
      if (username !== old) {
        const owner = await api.usernameOwner(username);
        if (owner && owner !== social.uid) throw Object.assign(new Error('taken'), { code: 'social/taken' });
      }
      const stats = getStats();
      const profile = { username, name, level: stats.level.level, streak: stats.curLogStreak, badges: stats.unlockedCount, pet: petPublic(stats.level.level) };
      await api.saveProfile(social.uid, profile, old);
      social.me = { ...(social.me || {}), uid: social.uid, ...profile, lastSeen: Date.now() };
      social.profiles[social.uid] = { ...social.me, fetchedAt: Date.now() };
      social.publishedSig = publishSig(profile);
      if (modalCtx && modalCtx.type === 'username') closeModal();
      if (social.status !== 'ready') socialListen();
      renderSocial();
      toast(old ? 'Username diperbarui ✓' : `Halo, @${username}! Sekarang kamu bisa cari teman 🎉`);
    } catch (err) {
      if (button) button.disabled = false;
      const taken = err.code === 'social/taken' || err.code === 'permission-denied';
      toast(taken ? `Username @${username} sudah dipakai. Coba yang lain.` : socialErrorText(err), 'error');
    }
  },
  chatSend: form => {
    const input = form.querySelector('input[name="text"]');
    if (!input) return;
    sendChat(input.value);
    input.value = '';
    input.focus();
  },
  visitSend: form => {
    const api = socialApi();
    const pet = activePet();
    const uid = form.dataset.uid;
    if (!api || !pet || !uid) return;
    if (myPetAway()) return toast(`${pet.name} masih berkunjung ke rumah teman`, 'error');
    const fd = new FormData(form);
    const note = cutText(fd.get('note'), 200);
    const gift = PET_GIFTS.includes(fd.get('gift')) ? String(fd.get('gift')) : '';
    api.sendVisit(social.uid, uid, petPublic(), note, gift).catch(err => toast(socialErrorText(err, `${pet.name} gagal berangkat — kalian masih berteman?`), 'error'));
    closeModal();
    toast(`${pet.name} berangkat ke rumah @${socialName(uid)}! 🐾`);
  },
  visitReply: form => {
    const api = socialApi();
    const v = activeVisitors().find(x => x.from === form.dataset.uid);
    if (!api || !v) return closeModal();
    const fd = new FormData(form);
    const reply = cutText(fd.get('reply'), 200);
    const gift = PET_GIFTS.includes(fd.get('gift')) ? String(fd.get('gift')) : '';
    const f = friendshipWith(v.from);
    api.sendHome(social.uid, v, reply, gift, Boolean(f && f.status === 'accepted')).catch(err => toast(socialErrorText(err), 'error'));
    closeModal();
    toast(`${v.pet.name} diantar pulang membawa ${reply ? 'balasanmu' : 'salam'} 💌`);
  },
  emailAuth: async form => {
    const fd = new FormData(form);
    const email = String(fd.get('email') || '').trim();
    const password = String(fd.get('password') || '');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return toast('Format email belum benar.', 'error');
    if (password.length < 6) return toast('Password minimal 6 karakter.', 'error');
    if (!(await cloudInit())) return toast(cloud.error, 'error');
    const button = form.querySelector('.btn.primary');
    if (button) button.disabled = true;
    const signup = form.dataset.mode === 'signup';
    const ok = await handleSignIn(signup ? cloud.api.signUpEmail(email, password) : cloud.api.signInEmail(email, password));
    if (!ok && button) button.disabled = false;
  },
  addFood: form => {
    if (!modalCtx || !modalCtx.food) return;
    const fd = new FormData(form);
    const qty = num(fd.get('qty'));
    if (!(qty > 0 && qty <= 50)) return toast('Jumlah porsi tidak valid (0–50)', 'error');
    const food = modalCtx.food;
    addFoodEntry(ui.date, fd.get('meal'), food, qty);
    closeModal();
    ui.foodQuery = '';
    render();
    return toast(`${food.name} ditambahkan ✓`);
  },
  editEntry: form => {
    if (!modalCtx || !modalCtx.id) return;
    const fd = new FormData(form);
    const qty = num(fd.get('qty'));
    if (!(qty > 0 && qty <= 50)) return toast('Jumlah porsi tidak valid (0–50)', 'error');
    const entry = ensureDay(ui.date).foods.find(f => f.id === modalCtx.id);
    if (entry) {
      entry.qty = r2(qty);
      entry.meal = validMeal(fd.get('meal'));
      save();
    }
    closeModal();
    render();
    return toast('Perubahan disimpan ✓');
  },
  manualFood: form => {
    const fd = new FormData(form);
    const name = String(fd.get('name') || '').trim();
    const kcal = num(fd.get('kcal'));
    if (!name) return toast('Nama makanan wajib diisi', 'error');
    if (!(kcal >= 0 && kcal <= 5000)) return toast('Kalori per porsi tidak valid', 'error');
    const macro = key => {
      const v = num(fd.get(key));
      return v >= 0 && v < 1000 ? r1(v) : 0;
    };
    const food = normalizeFood({
      name,
      portion: String(fd.get('portion') || '').trim() || '1 porsi',
      kcal: Math.round(kcal),
      protein: macro('protein'),
      carbs: macro('carbs'),
      fat: macro('fat'),
    });
    const qtyRaw = num(fd.get('qty'));
    const qty = qtyRaw > 0 && qtyRaw <= 50 ? qtyRaw : 1;
    if (fd.get('saveCustom')) {
      const existing = state.customFoods.find(c => c.name.toLowerCase() === food.name.toLowerCase() && c.portion === food.portion);
      if (existing) Object.assign(existing, food);
      else state.customFoods.push({ id: 'c' + uid(), ...food });
    }
    addFoodEntry(ui.date, fd.get('meal'), food, qty);
    closeModal();
    ui.foodQuery = '';
    render();
    return toast(`${food.name} ditambahkan ✓`);
  },
  addExercise: form => {
    const fd = new FormData(form);
    const act = String(fd.get('act'));
    const minutes = intNum(fd.get('minutes'));
    if (!(minutes > 0 && minutes <= 600)) return toast('Durasi harus 1–600 menit', 'error');
    let entry;
    if (act === 'custom') {
      const kcal = num(fd.get('customKcal'));
      if (!(kcal > 0 && kcal <= 5000)) return toast('Isi kalori terbakar (kkal)', 'error');
      entry = {
        id: uid(),
        name: String(fd.get('customName') || '').trim().slice(0, 60) || 'Aktivitas lain',
        met: null,
        minutes,
        kcal: Math.round(kcal),
      };
      ui.lastAct = 'custom';
    } else {
      const a = ACTIVITIES[Number(act)];
      if (!a) return toast('Pilih jenis aktivitas', 'error');
      entry = { id: uid(), name: a[0], met: a[1], minutes, kcal: Math.round(exKcal(a[1], minutes, weightOn(ui.date))) };
      ui.lastAct = Number(act);
    }
    ensureDay(ui.date).exercises.push(entry);
    save();
    render();
    return toast(`${entry.name}: ${fmt(entry.kcal)} kkal ✓`);
  },
  addWeight: form => {
    const fd = new FormData(form);
    const date = String(fd.get('date') || '');
    const kg = num(fd.get('kg'));
    const waistRaw = String(fd.get('waist') || '').trim();
    const waist = waistRaw ? num(waistRaw) : null;
    if (!isDateKey(date) || date > todayKey()) return toast('Tanggal tidak valid', 'error');
    if (!(kg >= 20 && kg <= 400)) return toast('Berat badan tidak valid', 'error');
    if (waist !== null && !(waist >= 30 && waist <= 250)) return toast('Lingkar perut tidak valid', 'error');
    upsertWeight(date, kg, waist);
    save();
    render();
    return toast(`Berat ${fmtMax(kg, 1)} kg tersimpan ✓`);
  },
  profile: form => {
    const fd = new FormData(form);
    const age = intNum(fd.get('age'));
    const height = num(fd.get('height'));
    const weight = num(fd.get('weight'));
    const goal = num(fd.get('goalWeight'));
    if (!(age >= 15 && age <= 100)) return toast('Usia harus 15–100 tahun', 'error');
    if (!(height >= 120 && height <= 230)) return toast('Tinggi badan harus 120–230 cm', 'error');
    if (!(weight >= 30 && weight <= 300)) return toast('Berat badan harus 30–300 kg', 'error');
    if (!(goal >= 30 && goal <= 300)) return toast('Berat target harus 30–300 kg', 'error');
    const p = state.profile;
    p.name = String(fd.get('name') || '').trim().slice(0, 40);
    p.sex = fd.get('sex') === 'female' ? 'female' : 'male';
    p.age = age;
    p.heightCm = r1(height);
    p.goalWeight = r1(goal);
    const activity = Number(fd.get('activity'));
    p.activity = ACTIVITY_LEVELS.some(a => a[0] === activity) ? activity : 1.2;
    const pace = Number(fd.get('pace'));
    p.pace = PACES.some(x => x[0] === pace) ? pace : 500;
    p.bmiStandard = BMI_STANDARDS[fd.get('bmiStandard')] ? String(fd.get('bmiStandard')) : 'kemenkes';
    const credit = Number(fd.get('exerciseCredit'));
    p.exerciseCredit = [0, 0.5, 1].includes(credit) ? credit : 0.5;
    const water = intNum(fd.get('waterTarget'));
    p.waterTargetMl = water >= 500 && water <= 8000 ? water : 0;
    const steps = intNum(fd.get('stepsTarget'));
    p.stepsTarget = steps >= 1000 && steps <= 50000 ? steps : 8000;
    p.confirmed = true;
    p.updatedAt = Date.now();
    if (Math.abs(r1(weight) - currentWeight()) >= 0.05) upsertWeight(todayKey(), weight, null);
    save();
    render();
    return toast('Profil tersimpan ✓ Target diperbarui');
  },
};

const inputs = {
  foodSearch: el => {
    ui.foodQuery = el.value;
    const results = $('#foodResults');
    if (results) results.innerHTML = foodResultsHtml();
  },
  qtyPreview: () => updateQtyPreview(),
  exPreview: () => updateExPreview(),
  socialSearch: el => {
    social.search.q = el.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(runSearch, 350);
  },
};

const changes = {
  pickDate: el => setDate(el.value || todayKey()),
  steps: el => {
    const v = intNum(el.value);
    const d = ensureDay(ui.date);
    d.steps = v >= 0 && v < 200000 ? v : null;
    save();
    const p = state.profile;
    const text = $('#stepsText');
    const bar = $('#stepsBar');
    if (text) text.textContent = `${fmt(d.steps || 0)} / ${fmt(p.stepsTarget)}`;
    if (bar) bar.style.width = clamp((d.steps || 0) / p.stepsTarget * 100, 0, 100) + '%';
    el.value = d.steps != null ? d.steps : '';
    toast('Langkah tersimpan ✓');
  },
  sleep: el => {
    const v = num(el.value);
    const d = ensureDay(ui.date);
    d.sleepH = v >= 0 && v <= 24 ? r1(v) : null;
    save();
    el.value = d.sleepH != null ? fmtInput(d.sleepH) : '';
    toast('Durasi tidur tersimpan ✓');
  },
  exAct: el => {
    ui.lastAct = el.value === 'custom' ? 'custom' : Number(el.value);
    const custom = $('#exCustom');
    if (custom) custom.hidden = el.value !== 'custom';
    updateExPreview();
  },
  importFile: el => importBackup(el),
};

/* =========================================================
   EVENT LISTENER
   ========================================================= */
document.addEventListener('click', e => {
  if (e.target.id === 'modal') {
    closeModal();
    return;
  }
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) fn(el, e);
});
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const fn = forms[form.dataset.form];
  if (fn) fn(form);
});
document.addEventListener('input', e => {
  const el = e.target.closest('[data-input]');
  if (el && inputs[el.dataset.input]) inputs[el.dataset.input](el, e);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]');
  if (el && changes[el.dataset.change]) changes[el.dataset.change](el, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#modal').hidden) {
    closeModal();
    return;
  }
  const t = e.target;
  if (!t || !t.matches) return;
  if ((e.key === 'Enter' || e.key === ' ') && t.matches('[role="button"][data-action]')) {
    e.preventDefault();
    t.click();
    return;
  }
  if (e.key === 'Enter' && t.matches('input[data-change]')) t.blur();
});
window.addEventListener('hashchange', () => {
  const tab = tabFromHash();
  if (tab !== ui.tab) setTab(tab);
});
window.addEventListener('resize', () => {
  const c = window.innerWidth < 600;
  if (c === compact) return;
  compact = c;
  if (ui.tab === 'berat' || ui.tab === 'statistik') render();
});
window.addEventListener('storage', e => {
  if (e.key !== STORAGE_KEY || !e.newValue) return;
  reloadFromStorage();
});
const arcadeKey = (e, down) => {
  const left = e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A';
  const right = e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D';
  if (!left && !right) return;
  if (left) arcade.keys.left = down;
  if (right) arcade.keys.right = down;
  if (arcade.running) {
    arcade.target = null;
    e.preventDefault();
  }
};
document.addEventListener('keydown', e => arcadeKey(e, true));
document.addEventListener('keyup', e => arcadeKey(e, false));
const arcadePointer = e => {
  if (!arcade.running || !e.target || e.target.id !== 'arcadeCanvas') return;
  const rect = e.target.getBoundingClientRect();
  arcade.target = clamp((e.clientX - rect.left) / rect.width, 0, 1);
};
document.addEventListener('pointerdown', arcadePointer);
document.addEventListener('pointermove', arcadePointer);
window.addEventListener('online', () => {
  if (cloud.user) scheduleSync(800);
  if (cloud.user && social.status === 'error') socialStart(true);
  else if (cloudEnabled() && syncMeta().uid && !cloud.ready) cloudInit();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') {
    arcadePause();
    return;
  }
  if (ui.followToday && ui.date !== todayKey()) {
    ui.date = todayKey();
    render();
  }
  // Kembali ke aplikasi setelah lama → cek versi baru
  if (Date.now() - updater.checkedAt > 60 * 60 * 1000) checkForUpdate(false);
  // Kembali ke aplikasi → ambil perubahan dari perangkat lain
  if (cloud.user && Date.now() - cloud.syncedAt > 30000) syncNow();
  if (socialReady() && Date.now() - social.touchedAt > 2 * 60 * 1000) socialTouch();
});
window.addEventListener('error', e => showSysBanner('Terjadi error: ' + (e.message || 'tidak diketahui')));

/* =========================================================
   MULAI
   ========================================================= */
function init() {
  storageOk = storageAvailable();
  let raw = null;
  if (storageOk) {
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      raw = null;
    }
  }
  const firstRun = !raw;
  if (raw) {
    try {
      state = normalizeState(JSON.parse(raw));
    } catch (e) {
      try {
        localStorage.setItem(STORAGE_KEY + '.rusak', raw);
      } catch (err) {
        /* abaikan */
      }
      state = defaultState();
      showSysBanner('Data lama tidak terbaca, jadi aplikasi memulai data baru. Salinan data lama disimpan dengan kunci "sehatku.data.v1.rusak".');
    }
  } else {
    state = defaultState();
  }
  // Sinkronkan lencana & level dari catatan lama tanpa perayaan beruntun
  checkProgress(true);
  if (firstRun) save();
  progressReady = true;
  if (!storageOk) {
    showSysBanner('⚠️ Penyimpanan browser tidak tersedia — data tidak tersimpan setelah halaman ditutup. Buka file ini dengan Microsoft Edge atau Google Chrome.');
  }
  ui.tab = tabFromHash();
  render();
  if (firstRun) openWelcome();
  else if (!state.game.introSeen) openGameIntro();
  else if (state.game.news !== NEWS_VERSION) openNews();
  noteVersionChange(firstRun);
  setTimeout(() => checkForUpdate(false), 2500);
  setInterval(() => checkForUpdate(false), UPDATE_CHECK_MS);
  cloudBoot();
}

window.SehatKu = {
  version: APP_VERSION,
  getData: () => JSON.parse(JSON.stringify(state)),
  targets: k => computeTargets(k || ui.date),
  stats: () => {
    const { facts, today, weeks, week, todayHits, ...summary } = getStats();
    return JSON.parse(JSON.stringify(summary));
  },
  missions: k => JSON.parse(JSON.stringify(missionsFor(k || todayKey()))),
  update: () => ({ current: APP_VERSION, status: updater.status, latest: updater.latest, checkedAt: updater.checkedAt }),
  checkUpdate: () => checkForUpdate(true),
  rewards: () => JSON.parse(JSON.stringify({ level: getStats().level.level, waiting: chestsWaiting(), ...state.game.rewards, arcade: state.game.arcade })),
  cloud: () => ({ enabled: cloudEnabled(), status: cloud.status, user: cloud.user, syncedAt: cloud.syncedAt, error: cloud.error }),
  pet: () => {
    const pet = activePet();
    return JSON.parse(JSON.stringify({ ...state.game.pet, active: pet ? { id: pet.id, name: pet.name, stage: pet.stage.id, level: pet.level } : null }));
  },
  social: () => JSON.parse(JSON.stringify({
    status: social.status, me: social.me, friendships: social.friendships, visitors: social.visitors,
    myVisit: social.myVisit, blocks: social.blocks, badge: socialBadgeCount(),
  })),
  game: () => {
    const s = getStats();
    return JSON.parse(JSON.stringify({
      week: { start: s.week.k, boss: s.week.boss.id, hp: s.week.boss.hp, dmg: s.week.dmg, days: s.week.days, wonOn: s.week.wonOn },
      todayHits: s.todayHits,
      bossWins: s.bossWins,
      trophies: s.trophies,
      trip: s.trip,
      quiz: state.game.quiz,
      xp: s.xp,
      level: s.level.level,
    }));
  },
};

init();
})();
</script>

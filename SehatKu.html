<style>
:root {
  color-scheme: light dark;
  --bg: #f3f6f5;
  --card: #ffffff;
  --text: #17251f;
  --muted: #64748b;
  --line: #e2e8e5;
  --soft: #f6f8f7;
  --primary: #0f9d76;
  --primary-soft: #e3f5ef;
  --ok: #16a34a;
  --warn: #f59e0b;
  --danger: #e5484d;
  --info: #2f80ed;
  --protein: #7c5cff;
  --carbs: #f5a524;
  --fat: #ef6b73;
  --water: #2d9cdb;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 6px 18px rgba(16, 24, 40, .06);
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e1412;
    --card: #161f1c;
    --text: #e5eeea;
    --muted: #94a3a0;
    --line: #26332e;
    --soft: #1b2622;
    --primary: #22b98f;
    --primary-soft: #163128;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.45;
}
button, input, select { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.25; }
h1 { font-size: 24px; letter-spacing: -.01em; }
h2 { font-size: 22px; }
h3 { font-size: 16px; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 24px; background: var(--card); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo {
  width: 38px; height: 38px; flex: none; border-radius: 12px;
  background: linear-gradient(135deg, #19c493, #0b7a5c);
  display: grid; place-items: center; font-size: 20px;
}
.brand-name { font-weight: 800; font-size: 18px; letter-spacing: -.01em; }
.brand-sub { font-size: 12px; color: var(--muted); }
.datenav { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 36px; height: 36px; padding: 0; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); cursor: pointer; font-size: 20px; line-height: 1;
  display: grid; place-items: center;
}
.icon-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.date-input {
  height: 36px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); padding: 0 10px; font-weight: 600;
}
.sys-banner { background: #fff4e5; color: #8a4b00; padding: 10px 24px; font-size: 14px; border-bottom: 1px solid #f5d9b0; }

/* ---------- Layout ---------- */
.shell {
  display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 24px;
  max-width: 1280px; margin: 0 auto; padding: 20px 24px 40px;
}
.tabs { position: sticky; top: 78px; align-self: start; display: flex; flex-direction: column; gap: 4px; }
.tab {
  display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-radius: 12px;
  border: 0; background: transparent; cursor: pointer; text-align: left; color: var(--muted); font-weight: 600;
}
.tab .ico { font-size: 18px; width: 24px; text-align: center; }
.tab:hover { background: var(--primary-soft); color: var(--text); }
.tab.active { background: var(--primary); color: #fff; }
.view { display: grid; gap: 16px; align-content: start; min-width: 0; }
.grid { display: grid; gap: 16px; align-items: start; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.eq { align-items: stretch; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 20px; min-width: 0;
}
.card > h3 { margin-bottom: 12px; }
.card-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 10px; margin-bottom: 12px; }
.page-title { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.page-title p { margin: 4px 0 0; color: var(--muted); }
.row { display: flex; align-items: center; gap: 10px; }
.row.wrap { flex-wrap: wrap; }
.row.gap-s { gap: 6px; }
.row.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.mt { margin-top: 12px; }
.sep { height: 1px; background: var(--line); margin: 14px 0; }
.empty { padding: 14px; text-align: center; color: var(--muted); font-size: 14px; background: var(--soft); border-radius: 12px; }
.text-danger { color: var(--danger); }
.text-ok { color: var(--ok); }
.warn-text { color: #b45309; font-size: 13px; }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card); cursor: pointer; font-weight: 600; white-space: nowrap;
}
.btn:hover { border-color: var(--primary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { border-color: var(--danger); }
.btn.small { height: 32px; padding: 0 10px; font-size: 13px; border-radius: 9px; }
.btn.ghost { background: transparent; }
.link-btn { background: none; border: 0; padding: 0; color: var(--primary); cursor: pointer; font-weight: 600; font-size: 14px; }
.x-btn {
  flex: none; width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent;
  color: var(--muted); cursor: pointer; font-size: 20px; line-height: 1;
}
.x-btn:hover { background: rgba(229, 72, 77, .12); color: var(--danger); }
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 99px;
  background: var(--primary-soft); color: var(--primary); font-weight: 700; font-size: 13px; white-space: nowrap;
}
.tag { display: inline-block; padding: 3px 9px; border-radius: 99px; color: #fff; font-weight: 700; font-size: 12px; }
.tag-s {
  display: inline-block; padding: 0 6px; border-radius: 6px; background: var(--primary-soft);
  color: var(--primary); font-size: 11px; font-weight: 700; vertical-align: middle;
}

/* ---------- Forms ---------- */
.form { display: grid; gap: 12px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .input {
  width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--soft); padding: 0 12px; color: var(--text); font-weight: 500; font-size: 15px;
}
.field input:focus, .field select:focus, .input:focus, .date-input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }
.hint-box {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 6px 6px 6px 12px; border-radius: 10px; background: var(--primary-soft); font-size: 14px; margin-bottom: 10px;
}
.note { padding: 10px 12px; border-radius: 10px; background: var(--primary-soft); font-size: 14px; }

/* ---------- Dashboard ---------- */
.cal-wrap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; }
.ring-box { position: relative; width: 170px; height: 170px; }
.ring-box svg { display: block; }
.ring-bg { stroke: var(--line); }
.ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-center .big { font-size: 32px; font-weight: 800; line-height: 1.05; }
.ring-center .lbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
.stats3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--soft); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat .l { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 19px; font-weight: 800; white-space: nowrap; }
.stat .v small { font-size: 12px; font-weight: 600; color: var(--muted); }
.bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: inherit; background: var(--primary); transition: width .3s; }
.bar.thin { height: 6px; }
.metric { display: grid; gap: 6px; margin-bottom: 14px; }
.metric:last-child { margin-bottom: 0; }
.metric .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.meal-sum { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.meal-sum:last-child { border-bottom: 0; }
.big-num { font-size: 30px; font-weight: 800; line-height: 1.1; }
.big-num small { font-size: 15px; color: var(--muted); font-weight: 600; }
.glasses { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; }
.glass {
  position: relative; width: 28px; height: 36px; padding: 0; overflow: hidden; cursor: pointer;
  border: 2px solid var(--water); border-top-width: 1px; border-radius: 3px 3px 9px 9px; background: transparent;
}
.glass.full::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 82%; background: var(--water); opacity: .85; }
.glass:hover { transform: translateY(-2px); }
.insights { display: grid; gap: 8px; }
.insight { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; font-size: 14px; }
.insight .i { flex: none; }
.insight.ok { background: rgba(22, 163, 74, .10); }
.insight.warn { background: rgba(245, 158, 11, .14); }
.insight.danger { background: rgba(229, 72, 77, .12); }
.insight.info { background: rgba(47, 128, 237, .10); }
.banner {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px;
  border-radius: 14px; background: rgba(47, 128, 237, .08); border: 1px solid rgba(47, 128, 237, .25); font-size: 14px;
}
.gauge { position: relative; margin-top: 12px; }
.gauge-bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; }
.gauge-bar > span { display: block; height: 100%; }
.gauge-marker {
  position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px;
  background: var(--text); box-shadow: 0 0 0 2px var(--card);
}
.gauge-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }

/* ---------- Food ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.chip {
  height: 30px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--card);
  cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap;
}
.chip:hover { border-color: var(--primary); color: var(--text); }
.chip.active { background: var(--primary); border-color: var(--primary); color: #fff; }
.food-results { display: grid; gap: 6px; max-height: 470px; overflow-y: auto; padding-right: 4px; }
.food-item, .entry {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 12px; border-radius: 12px; cursor: pointer;
}
.food-item { border: 1px solid var(--line); }
.food-item:hover { border-color: var(--primary); background: var(--primary-soft); }
.entry:hover { background: var(--soft); }
.food-item:focus-visible, .entry:focus-visible { outline: 2px solid var(--primary); }
.name { font-weight: 600; }
.meta { font-size: 12px; color: var(--muted); }
.kcal { font-weight: 700; white-space: nowrap; }
.meal { padding: 12px 0; border-top: 1px solid var(--line); }
.meals .meal:first-child { border-top: 0; padding-top: 0; }
.meal-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.meal-title { font-weight: 700; }

/* ---------- Modal & toast ---------- */
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: rgba(8, 18, 14, .45); }
.modal-card {
  width: min(480px, 100%); max-height: 92vh; overflow: auto; background: var(--card);
  border-radius: 18px; padding: 20px; box-shadow: 0 24px 64px rgba(0, 0, 0, .25);
}
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.modal-actions { display: flex; justify-content: flex-end; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.modal-actions .spacer { flex: 1; }
.nutri { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.nutri div { background: var(--soft); border-radius: 10px; padding: 8px; text-align: center; }
.nutri b { display: block; font-size: 18px; }
.nutri span { font-size: 11px; color: var(--muted); }
.welcome { text-align: center; }
.welcome .logo { width: 64px; height: 64px; font-size: 34px; margin: 0 auto 12px; border-radius: 18px; }
.welcome p { margin: 8px 0; }
.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 200; display: flex; align-items: center; gap: 12px;
  max-width: calc(100% - 32px); padding: 11px 16px; border-radius: 12px; background: #17251f; color: #fff;
  font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transform: translate(-50%, 16px);
  transition: opacity .2s, transform .2s;
}

/* ---------- Charts ---------- */

.intro-mascot { display: inline-block; font-size: 64px; line-height: 1.1; animation: bob 3.2s ease-in-out infinite; }

@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(4deg); } }

@media (prefers-reduced-motion: reduce) {

function roundedValue(n, dec) {
  const p = Math.pow(10, dec);
  const v = Math.round((Number(n) || 0) * p) / p;
  return v === 0 ? 0 : v;   // hindari tampilan "-0"
}
function fmt(n, dec = 0) {
  return roundedValue(n, dec).toLocaleString('id-ID', { minimumFractionDigits: dec, maximumFractionDigits: dec });
}
function fmtMax(n, dec = 1) {
  return roundedValue(n, dec).toLocaleString('id-ID', { maximumFractionDigits: dec });
}
function fmtSigned(n, dec = 1) {
  const v = roundedValue(n, dec);
  if (v === 0) return '±0';
  return (v > 0 ? '+' : '−') + fmtMax(Math.abs(v), dec);
}

// Menerima "83,5", "83.5", "1.600" (ribuan) maupun "1,600.5"
function num(v) {
  let s = String(v ?? '').trim().replace(/\s+/g, '');
  if (!s) return NaN;
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
  else s = s.replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}
function intNum(v) {
  const s = String(v ?? '').replace(/[^\d]/g, '');
  return s ? Number(s) : NaN;
}

// Data lama (tanpa gamifikasi) → introSeen false supaya pengenalan fitur muncul sekali
function normalizeGame(g) {
  const game = newGame(false);
  if (!g || typeof g !== 'object') return game;
  game.introSeen = Boolean(g.introSeen);
  game.sound = Boolean(g.sound);
  game.level = Math.max(1, Math.floor(Number(g.level) || 1));
  if (g.unlocked && typeof g.unlocked === 'object') {
    for (const [id, date] of Object.entries(g.unlocked)) {
      if (BADGES.some(b => b.id === id) && isDateKey(date)) game.unlocked[id] = date;
    }
  }
  if (g.perfect && typeof g.perfect === 'object') {
    for (const [date, done] of Object.entries(g.perfect)) {
      if (isDateKey(date) && done) game.perfect[date] = true;
    }
  }
  // Data v1.1 belum punya kolom di bawah ini → pakai nilai awal
  game.news = typeof g.news === 'string' ? g.news.slice(0, 12) : '';
  if (g.quiz && typeof g.quiz === 'object') {
    const count = v => Math.max(0, Math.floor(Number(v) || 0));
    game.quiz = {
      best: count(g.quiz.best),
      played: count(g.quiz.played),
      correct: count(g.quiz.correct),
      xp: count(g.quiz.xp),
      day: isDateKey(g.quiz.day) ? g.quiz.day : '',
      dayXp: Math.min(QUIZ_XP_CAP, count(g.quiz.dayXp)),
    };
  }
  if (g.bosses && typeof g.bosses === 'object') {
    for (const [week, id] of Object.entries(g.bosses)) {
      if (isDateKey(week) && BOSSES.some(b => b.id === id)) game.bosses[week] = id;
    }
  }
  if (g.trip && typeof g.trip === 'object') {
    game.trip = {
      key: String(g.trip.key || '').slice(0, 40),
      stop: clamp(Math.floor(Number(g.trip.stop) || 0), 0, CITIES.length - 1),
    };
  }
  const whole = v => Math.max(0, Math.floor(Number(v) || 0));
  if (g.rewards && typeof g.rewards === 'object') {
    const r = g.rewards;
    Object.assign(game.rewards, { opened: whole(r.opened), stars: whole(r.stars), redeemed: whole(r.redeemed) });
    if (r.stickers && typeof r.stickers === 'object') {
      for (const [id, n] of Object.entries(r.stickers)) {
        if (STICKERS.some(s => s.id === id) && whole(n) > 0) game.rewards.stickers[id] = whole(n);
      }
    }
    if (OUTFITS.some(o => o.id === r.outfit)) game.rewards.outfit = r.outfit;
    if (THEMES.some(t => t.id === r.theme)) game.rewards.theme = r.theme;
  }
  if (g.arcade && typeof g.arcade === 'object') {
    const a = g.arcade;
    game.arcade = {
      best: whole(a.best), played: whole(a.played), xp: whole(a.xp),
      day: isDateKey(a.day) ? a.day : '', dayXp: Math.min(ARCADE_XP_CAP, whole(a.dayXp)),
    };
  }
  if (g.pet && typeof g.pet === 'object') {
    const p = g.pet;
    if (PET_SPECIES.some(s => s.id === p.species)) game.pet.species = p.species;
    if (p.names && typeof p.names === 'object') {
      for (const [id, name] of Object.entries(p.names)) {
        const clean = typeof name === 'string' ? name.trim().slice(0, PET_NAME_MAX) : '';
        if (clean && PET_SPECIES.some(s => s.id === id)) game.pet.names[id] = clean;
      }
    }
    game.pet.adopted = isDateKey(p.adopted) ? p.adopted : '';
    game.pet.pats = whole(p.pats);
    game.pet.updatedAt = Number(p.updatedAt) > 0 ? Number(p.updatedAt) : 0;
  }
  return game;
}

// Penghapusan (id → waktu) disimpan supaya ikut terhapus di perangkat lain saat sinkron
function normalizeDeleted(d) {
  const out = {};
  if (!d || typeof d !== 'object') return out;
  const cutoff = Date.now() - TOMBSTONE_DAYS * 86400000;
  for (const [id, at] of Object.entries(d)) {
    const time = Number(at);
    if (id && Number.isFinite(time) && time > cutoff) out[String(id).slice(0, 40)] = time;
  }
  return out;
}
function markDeleted(id) {
  if (id) state.deleted[id] = Date.now();
}

function normalizeState(s) {
  const base = defaultState();
  if (!s || typeof s !== 'object') return base;
  const profile = { ...base.profile, ...(s.profile && typeof s.profile === 'object' ? s.profile : {}) };
  for (const key of ['age', 'heightCm', 'activity', 'startWeight', 'goalWeight', 'pace', 'exerciseCredit', 'waterTargetMl', 'stepsTarget']) {
    const v = Number(profile[key]);
    profile[key] = Number.isFinite(v) ? v : base.profile[key];
  }
  profile.sex = profile.sex === 'female' ? 'female' : 'male';
  profile.name = String(profile.name || '').slice(0, 40);
  profile.confirmed = Boolean(profile.confirmed);
  profile.updatedAt = Number(profile.updatedAt) > 0 ? Number(profile.updatedAt) : 0;
  if (!BMI_STANDARDS[profile.bmiStandard]) profile.bmiStandard = 'kemenkes';

  const days = {};
  if (s.days && typeof s.days === 'object') {
    for (const [k, d] of Object.entries(s.days)) {
      if (!isDateKey(k) || !d || typeof d !== 'object') continue;
      days[k] = {
        foods: (Array.isArray(d.foods) ? d.foods : [])
          .filter(f => f && typeof f.name === 'string')
          .map(f => ({
            id: String(f.id || uid()),
            meal: MEALS.some(m => m.id === f.meal) ? f.meal : 'camilan',
            qty: Number(f.qty) > 0 ? Number(f.qty) : 1,
            ...normalizeFood(f),
          })),
        exercises: (Array.isArray(d.exercises) ? d.exercises : [])
          .filter(e => e && Number.isFinite(Number(e.kcal)))
          .map(e => ({
            id: String(e.id || uid()),
            name: String(e.name || 'Aktivitas').slice(0, 60),
            met: optNum(e.met),
            minutes: Math.max(0, Number(e.minutes) || 0),
            kcal: Math.max(0, Number(e.kcal) || 0),
          })),
        waterMl: Math.max(0, Number(d.waterMl) || 0),
        steps: optNum(d.steps),
        sleepH: optNum(d.sleepH),
      };
    }
  }
  const weights = Array.isArray(s.weights)
    ? s.weights
      .filter(w => w && isDateKey(w.date) && Number(w.kg) > 0)
      .map(w => ({ id: String(w.id || uid()), date: w.date, kg: Number(w.kg), waist: Number(w.waist) > 0 ? Number(w.waist) : null }))
    : base.weights;
  const customFoods = Array.isArray(s.customFoods)
    ? s.customFoods.filter(f => f && f.name).map(f => ({ id: String(f.id || 'c' + uid()), ...normalizeFood(f) }))
    : [];
  return {
    version: 1,
    createdAt: isDateKey(s.createdAt) ? s.createdAt : base.createdAt,
    profile,
    days,
    weights,
    customFoods,
    deleted: normalizeDeleted(s.deleted),
    game: normalizeGame(s.game),
  };
}

function sortedWeights() {

}
function weightOn(k) {
  const ws = sortedWeights();
  if (!ws.length) return state.profile.startWeight;
  let w = ws[0].kg;
  for (const e of ws) {
    if (e.date > k) break;
    w = e.kg;
  }
  return w;
}
function currentWeight() {
  const ws = sortedWeights();
  return ws.length ? ws[ws.length - 1].kg : state.profile.startWeight;
}

}
function upsertWeight(date, kg, waist) {
  const existing = state.weights.find(w => w.date === date);
  if (existing) {
    existing.kg = r1(kg);
    if (waist != null) existing.waist = r1(waist);
  } else {
    state.weights.push({ id: uid(), date, kg: r1(kg), waist: waist != null ? r1(waist) : null });
  }
}

   ========================================================= */
const bmiOf = kg => kg / Math.pow(state.profile.heightCm / 100, 2);
const bmiStd = () => BMI_STANDARDS[state.profile.bmiStandard] || BMI_STANDARDS.kemenkes;
function bmiCategory(bmi, std = bmiStd()) {
  const b = r1(bmi);
  for (const c of std.cats) {
    if (c.incl ? b <= c.upTo : b < c.upTo) return c;
  }
  return std.cats[std.cats.length - 1];
}

// BMR Mifflin-St Jeor → TDEE → target kalori, makro, air
function computeTargets(k = ui.date) {
  const p = state.profile;
  const w = weightOn(k);
  const bmr = 10 * w + 6.25 * p.heightCm - 5 * p.age + (p.sex === 'female' ? -161 : 5);
  const tdee = bmr * p.activity;
  const diff = p.goalWeight - w;
  let mode = 'maintain';
  let adj = 0;
  if (p.goalWeight > 0 && diff <= -0.5) {
    mode = 'lose';
    adj = -p.pace;
  } else if (p.goalWeight > 0 && diff >= 0.5) {
    mode = 'gain';
    adj = Math.min(p.pace, 500);
  }
  const floor = Math.min(p.sex === 'female' ? 1200 : 1500, roundTo(tdee, 10));
  let kcal = tdee + adj;
  let floored = false;
  if (kcal < floor) {
    kcal = floor;
    floored = true;
  }
  kcal = roundTo(kcal, 10);
  const shownAdj = floored ? Math.round(kcal - tdee) : adj;
  const refW = mode === 'lose' ? p.goalWeight : w;
  const protein = roundTo(1.6 * refW, 5);
  const fat = Math.round(kcal * 0.27 / 9);
  const carbs = Math.max(0, Math.round((kcal - protein * 4 - fat * 9) / 4));
  const waterMl = p.waterTargetMl > 0 ? p.waterTargetMl : roundTo(30 * w, GLASS_ML);
  return {
    w, bmr, tdee, mode, adj: shownAdj, kcal, floored, floor, refW, protein, fat, carbs, waterMl,
    kgPerWeek: shownAdj * 7 / KCAL_PER_KG,
  };
}

function dayTotals(k) {
  const d = getDay(k);
  let kcal = 0;
  let protein = 0;
  let carbs = 0;
  let fat = 0;
  for (const f of d.foods) {
    kcal += f.kcal * f.qty;
    protein += f.protein * f.qty;
    carbs += f.carbs * f.qty;
    fat += f.fat * f.qty;
  }
  const burned = d.exercises.reduce((s, e) => s + (e.kcal || 0), 0);
  const exMin = d.exercises.reduce((s, e) => s + (e.minutes || 0), 0);
  return { kcal, protein, carbs, fat, burned, exMin, water: d.waterMl || 0, steps: d.steps, sleepH: d.sleepH, foodCount: d.foods.length };
}

const exKcal = (met, minutes, kg) => met * kg * minutes / 60;

// Menit aktif setara intensitas sedang (WHO): MET ≥ 6 dihitung 2x, MET < 3 tidak dihitung
function weeklyActiveMinutes(k) {
  let total = 0;
  for (let i = 0; i < 7; i++) {
    for (const e of getDay(addDays(k, -i)).exercises) {
      const m = e.minutes || 0;
      if (e.met == null) total += m;
      else if (e.met >= 6) total += 2 * m;
      else if (e.met >= 3) total += m;
    }
  }
  return Math.round(total);
}

// Regresi linear berat 28 hari terakhir → kg/minggu
function weightTrend() {
  const ws = sortedWeights();
  if (ws.length < 2) return null;
  const last = ws[ws.length - 1].date;
  const recent = ws.filter(w => daysBetween(w.date, last) <= 28);
  if (recent.length < 2) return null;
  const span = daysBetween(recent[0].date, last);
  if (span < 6) return null;
  const xs = recent.map(w => daysBetween(recent[0].date, w.date));
  const ys = recent.map(w => w.kg);
  const mx = xs.reduce((a, b) => a + b, 0) / xs.length;
  const my = ys.reduce((a, b) => a + b, 0) / ys.length;
  let sxy = 0;
  let sxx = 0;
  xs.forEach((x, i) => {
    sxy += (x - mx) * (ys[i] - my);
    sxx += (x - mx) * (x - mx);
  });
  if (!sxx) return null;
  return { perWeek: (sxy / sxx) * 7, span, n: recent.length };
}

function recentFoods(limit = 8) {
  const out = [];
  const seen = new Set();
  for (const k of Object.keys(state.days).sort().reverse()) {
    for (const f of state.days[k].foods.slice().reverse()) {
      const key = f.name + '|' + f.portion;
      if (seen.has(key)) continue;
      seen.add(key);
      out.push(f);
      if (out.length >= limit) return out;
    }
  }
  return out;
}

function searchFoods(query, cat) {

function insightsFor(k, t, tot) {

  if (t.mode === 'lose' && change <= -0.5) {

  }
  return out;
}

/* =========================================================
   GAMIFIKASI: XP, LEVEL, STREAK, MISI, LENCANA, PERAYAAN
   ========================================================= */
function hashString(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function seededRandom(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const pickSeeded = (list, seedText) => list[Math.floor(seededRandom(hashString(seedText))() * list.length)];
const walkMinutes = (kcal, k) => kcal / exKcal(4.3, 1, weightOn(k));
const mondayOf = k => addDays(k, -((parseKey(k).getDay() + 6) % 7));
function equivalentText(kcal, seedText) {
  const e = pickSeeded(EQUIVALENTS, 'eq|' + seedText);
  return `${fmtMax(kcal / e.kcal, 1)} ${e.emoji} ${e.name}`;
}
function foodEmoji(f) {
  const name = String(f.name || '');
  const rule = FOOD_EMOJI_RULES.find(([re]) => re.test(name));
  return rule ? rule[1] : CAT_EMOJI[f.cat] || '🍽️';
}

// Boss berganti tiap Senin, berurutan dari BOSS_EPOCH
function bossOfWeek(weekStart) {
  const n = Math.floor(daysBetween(BOSS_EPOCH, weekStart) / 7);
  return BOSSES[((n % BOSSES.length) + BOSSES.length) % BOSSES.length];
}
function bossHits(f, boss) {
  const list = [];
  let total = 0;
  for (const h of BOSS_HITS) {
    if (!h.on(f)) continue;
    const base = h.dmg + (h.bonus ? h.bonus(f) : 0);
    const crit = boss.weak.includes(h.id);
    const dmg = crit ? base * 2 : base;
    total += dmg;
    list.push({ id: h.id, icon: h.icon, label: h.label, dmg, crit });
  }
  return { total, list };
}

// Fakta harian yang dipakai XP, misi, streak dan lencana
function dayFacts(k) {
  const p = state.profile;
  const d = getDay(k);
  const tot = dayTotals(k);
  const t = computeTargets(k);
  const names = d.foods.map(f => f.name);
  const mainMeals = new Set(d.foods.filter(f => f.meal !== 'camilan').map(f => f.meal)).size;
  const budget = t.kcal + tot.burned * p.exerciseCredit;
  const logged = tot.foodCount > 0;
  const settled = k < todayKey() || mainMeals >= 3;
  return {
    k,
    tot,
    t,
    budget,
    logged,
    mainMeals,
    onTarget: logged && settled && tot.kcal >= budget * 0.8 && tot.kcal <= budget * 1.05,
    over: logged && tot.kcal > budget * 1.05,
    protein: logged && tot.protein >= t.protein * 0.9,
    water: tot.water >= t.waterMl,
    exercised: tot.exMin > 0,
    exercise30: tot.exMin >= 30,
    steps: tot.steps != null && tot.steps >= p.stepsTarget,
    sleep: tot.sleepH != null && tot.sleepH >= 7 && tot.sleepH <= 9,
    veggie: names.some(n => VEGGIE_RE.test(n)),
    fruit: names.some(n => FRUIT_RE.test(n)),
    fried: names.some(n => FRIED_RE.test(n)),
    sugary: names.some(n => SUGARY_RE.test(n)),
    hasData: logged || tot.exMin > 0 || tot.water > 0 || tot.steps != null || tot.sleepH != null,
  };
}

// 2 misi tetap + 2 misi acak yang sama sepanjang hari (diacak dari tanggal)
function missionIds(k) {
  const rand = seededRandom(hashString('misi|' + k));
  const pool = MISSION_RANDOM.slice();
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return MISSION_FIXED.concat(pool.slice(0, 2));
}
function missionsFor(k, facts = dayFacts(k)) {
  const list = missionIds(k).map(id => {
    const m = MISSION_POOL[id];
    const [cur, goal] = m.progress(facts);
    const failed = m.failed ? m.failed(facts) : false;
    return { id, icon: m.icon, label: m.label(facts), cur, goal, failed, done: !failed && cur >= goal };
  });
  const doneCount = list.filter(m => m.done).length;
  return { list, doneCount, allDone: doneCount === list.length };
}
function dayXp(f, missions) {
  let xp = 0;
  if (f.logged) xp += 10;
  if (f.mainMeals >= 3) xp += 10;
  if (f.onTarget) xp += 20;
  if (f.protein) xp += 15;
  if (f.water) xp += 15;
  if (f.exercised) xp += 10;
  if (f.exercise30) xp += 10;
  if (f.steps) xp += 10;
  if (f.sleep) xp += 10;
  return xp + missions.doneCount * MISSION_XP + (missions.allDone ? PERFECT_XP : 0);
}

// Level L butuh total 50 × L × (L − 1) XP → tiap level berikutnya +100 × L XP
function levelTitle(level) {
  const entry = LEVELS[Math.min(level, LEVELS.length) - 1];
  const extra = level > LEVELS.length ? ` ★${level - LEVELS.length}` : '';
  return { emoji: entry[0], title: entry[1] + extra };
}
function levelInfo(xp) {
  let level = 1;
  while (xp >= 50 * (level + 1) * level) level += 1;
  const floor = 50 * level * (level - 1);
  return { level, xp, cur: xp - floor, need: 100 * level, ...levelTitle(level) };
}
function currentStreak(today, pred) {
  let k = pred(today) ? today : addDays(today, -1);
  let n = 0;
  while (pred(k) && n < 5000) {
    n += 1;
    k = addDays(k, -1);
  }
  return n;
}

function computeStats(today) {
  const p = state.profile;
  const dayKeys = Object.keys(state.days).filter(k => k <= today).sort();
  const weightKeys = state.weights.map(w => w.date).filter(k => k <= today).sort();
  let k = [dayKeys[0], weightKeys[0], today].filter(Boolean).sort()[0];
  if (daysBetween(k, today) > 1500) k = addDays(today, -1500);
  const facts = {};
  const weeks = {};
  const s = {
    daysLogged: 0, targetDays: 0, proteinDays: 0, waterDays: 0, exerciseDays: 0, sleepDays: 0,
    veggieDays: 0, fruitDays: 0, perfectDays: 0, maxSteps: 0, maxWeekActive: 0,
    maxLogStreak: 0, maxTargetStreak: 0, maxNoFried: 0, maxNoSugar: 0, dayXp: 0,
  };
  let logRun = 0;
  let targetRun = 0;
  let noFriedRun = 0;
  let noSugarRun = 0;
  while (k <= today) {
    const f = dayFacts(k);
    const m = missionsFor(k, f);
    const isToday = k === today;
    facts[k] = { f, m };
    const weekStart = mondayOf(k);
    if (!weeks[weekStart]) weeks[weekStart] = { k: weekStart, boss: bossOfWeek(weekStart), dmg: 0, days: {}, wonOn: null };
    const week = weeks[weekStart];
    const dmg = bossHits(f, week.boss).total;
    week.days[k] = dmg;
    week.dmg += dmg;
    if (!week.wonOn && week.dmg >= week.boss.hp) week.wonOn = k;
    if (f.logged) s.daysLogged += 1;
    if (f.onTarget) s.targetDays += 1;
    if (f.protein) s.proteinDays += 1;
    if (f.water) s.waterDays += 1;
    if (f.exercised) {
      s.exerciseDays += 1;
      s.maxWeekActive = Math.max(s.maxWeekActive, weeklyActiveMinutes(k));
    }
    if (f.sleep) s.sleepDays += 1;
    if (f.veggie) s.veggieDays += 1;
    if (f.fruit) s.fruitDays += 1;
    if (m.allDone) s.perfectDays += 1;
    s.maxSteps = Math.max(s.maxSteps, f.tot.steps || 0);
    if (f.hasData) s.dayXp += dayXp(f, m);

    // Hari ini yang belum selesai tidak memutus streak
    if (f.logged) logRun += 1;
    else if (!isToday) logRun = 0;
    s.maxLogStreak = Math.max(s.maxLogStreak, logRun);
    if (f.onTarget) targetRun += 1;
    else if (!isToday || f.over) targetRun = 0;
    s.maxTargetStreak = Math.max(s.maxTargetStreak, targetRun);
    if (f.logged && f.mainMeals >= 2 && !f.fried) noFriedRun += 1;
    else if (!isToday || f.fried) noFriedRun = 0;
    s.maxNoFried = Math.max(s.maxNoFried, noFriedRun);
    if (f.logged && f.mainMeals >= 2 && !f.sugary) noSugarRun += 1;
    else if (!isToday || f.sugary) noSugarRun = 0;
    s.maxNoSugar = Math.max(s.maxNoSugar, noSugarRun);
    k = addDays(k, 1);
  }
  const todayEntry = facts[today];
  s.facts = facts;
  s.today = todayEntry;
  s.todayXp = todayEntry.f.hasData ? dayXp(todayEntry.f, todayEntry.m) : 0;
  s.curLogStreak = currentStreak(today, key => Boolean(facts[key] && facts[key].f.logged));
  s.logAtRisk = !todayEntry.f.logged && s.curLogStreak > 0;
  s.curTargetStreak = currentStreak(today, key => Boolean(facts[key] && facts[key].f.onTarget));
  s.weighIns = state.weights.length;
  const weighWeeks = new Set(state.weights.map(w => mondayOf(w.date))).size;
  const start = startWeight();
  const goal = p.goalWeight;
  const total = Math.abs(start - goal);
  const toward = (currentWeight() - start) * (goal >= start ? 1 : -1);
  s.towardGoal = Math.max(0, r1(toward));
  s.goalPct = total >= 0.5 ? clamp(toward / total * 100, 0, 100) : 0;

  // Boss mingguan
  s.weeks = weeks;
  s.week = weeks[mondayOf(today)];
  s.todayHits = bossHits(todayEntry.f, s.week.boss);
  s.bossWins = 0;
  s.trophies = {};
  for (const w of Object.values(weeks)) {
    if (!w.wonOn) continue;
    s.bossWins += 1;
    s.trophies[w.boss.id] = (s.trophies[w.boss.id] || 0) + 1;
  }

  // Peta Nusantara: progres berat target (atau hari mencatat untuk mode jaga berat)
  const byGoal = total >= 0.5;
  const tripPct = byGoal ? s.goalPct : clamp(s.daysLogged / TRIP_DAYS * 100, 0, 100);
  s.trip = {
    byGoal,
    pct: tripPct,
    stop: Math.min(CITIES.length - 1, Math.floor(tripPct / 100 * (CITIES.length - 1) + 1e-9)),
    key: byGoal ? `goal|${r1(start)}|${r1(goal)}` : 'days',
    totalKg: total,
    kgPerStop: total / (CITIES.length - 1),
  };
  s.tripStop = s.trip.stop;
  s.quizBest = state.game.quiz.best;

  s.unlockedCount = BADGES.filter(b => state.game.unlocked[b.id]).length;
  s.xp = s.dayXp + weighWeeks * 15 + s.unlockedCount * BADGE_XP + s.bossWins * BOSS_XP + state.game.quiz.xp + state.game.arcade.xp;
  s.level = levelInfo(s.xp);
  return s;
}
function getStats() {
  const today = todayKey();
  const key = dataVersion + '|' + today;
  if (statsCache.key !== key) statsCache = { key, value: computeStats(today) };
  return statsCache.value;
}

// Cek lencana baru, naik level & hari sempurna → simpan, lalu rayakan
function checkProgress(silent) {
  const g = state.game;
  const today = todayKey();
  let stats = getStats();
  const events = [];
  for (const b of BADGES) {
    if (!g.unlocked[b.id] && b.value(stats) >= b.goal) {
      g.unlocked[b.id] = today;
      events.push({ type: 'badge', badge: b });
    }
  }
  if (events.length) {
    dataVersion += 1;
    stats = getStats();
  }
  let dirty = false;
  for (const week of Object.values(stats.weeks)) {
    if (week.wonOn && g.bosses[week.k] !== week.boss.id) {
      g.bosses[week.k] = week.boss.id;
      dirty = true;
      events.push({ type: 'boss', boss: week.boss });
    }
  }
  const trip = stats.trip;
  if (g.trip.key !== trip.key) {
    // Target/berat awal berubah → mulai ulang penanda tanpa perayaan
    g.trip = { key: trip.key, stop: trip.stop };
    dirty = true;
  } else if (trip.stop > g.trip.stop) {
    g.trip.stop = trip.stop;
    dirty = true;
    events.push({ type: 'city', city: CITIES[trip.stop] });
  }
  if (stats.level.level > g.level) {
    const from = g.level;
    g.level = stats.level.level;
    events.push({ type: 'level', info: stats.level, from });
  }
  if (stats.today.m.allDone && !g.perfect[today]) {
    g.perfect[today] = true;
    events.push({ type: 'perfect' });
  }
  if (!events.length && !dirty) return events;
  writeStorage();
  if (!silent && events.length) celebrate(events);
  return events;
}

function mascotFor(k, f, missions, stats) {
  const isToday = k === todayKey();
  const hour = new Date().getHours();
  const tot = f.tot;
  const remaining = Math.round(f.budget - tot.kcal);
  const glasses = Math.floor(tot.water / GLASS_ML);
  let mood;
  if (missions.allDone) mood = 'perfect';
  else if (f.logged && tot.kcal > f.budget + 50) mood = 'over';
  else if (!isToday) mood = 'past';
  else if (hour >= 22) mood = 'night';
  else if (!f.logged && stats.logAtRisk && stats.curLogStreak >= 2) mood = 'risk';
  else if (!f.logged) mood = 'empty';
  else if (hour >= 13 && tot.water < f.t.waterMl * 0.5) mood = 'thirsty';
  else if (tot.kcal >= f.budget * 0.9) mood = 'near';
  else mood = 'good';
  const line = pickSeeded(MASCOT_LINES[mood], [k, mood, tot.foodCount, glasses, missions.doneCount].join('|'));
  const text = line
    .replace('{over}', fmt(Math.max(0, -remaining)))
    .replace('{walk}', fmt(walkMinutes(Math.max(0, -remaining), k)))
    .replace('{rem}', fmt(Math.max(0, remaining)))
    .replace('{water}', String(glasses))
    .replace('{streak}', String(stats.curLogStreak))
    .replace('{equiv}', equivalentText(Math.max(0, remaining), k));
  return { mood, face: MASCOT_FACES[mood], text };
}

function missionRowHtml(m) {

function confetti() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti';
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  const width = window.innerWidth;
  const height = window.innerHeight;
  canvas.width = width * ratio;
  canvas.height = height * ratio;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  if (!ctx) {
    canvas.remove();
    return;
  }
  ctx.scale(ratio, ratio);
  const colors = ['#19c493', '#f5a524', '#ef6b73', '#7c5cff', '#2d9cdb', '#ffd56b'];
  const pieces = Array.from({ length: 140 }, () => ({
    x: width / 2 + (Math.random() - 0.5) * width * 0.3,
    y: height * 0.38,
    vx: (Math.random() - 0.5) * 15,
    vy: -Math.random() * 13 - 4,
    size: 6 + Math.random() * 6,
    rot: Math.random() * Math.PI,
    spin: (Math.random() - 0.5) * 0.3,
    color: colors[Math.floor(Math.random() * colors.length)],
    round: Math.random() < 0.4,
  }));
  const started = performance.now();
  const duration = 2600;
  const frame = now => {
    const elapsed = now - started;
    ctx.clearRect(0, 0, width, height);
    ctx.globalAlpha = Math.max(0, 1 - elapsed / duration);
    for (const piece of pieces) {
      piece.vy += 0.35;
      piece.vx *= 0.99;
      piece.x += piece.vx;
      piece.y += piece.vy;
      piece.rot += piece.spin;
      ctx.save();
      ctx.translate(piece.x, piece.y);
      ctx.rotate(piece.rot);
      ctx.fillStyle = piece.color;
      if (piece.round) {
        ctx.beginPath();
        ctx.arc(0, 0, piece.size / 2.5, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.fillRect(-piece.size / 2, -piece.size / 3, piece.size, piece.size * 0.6);
      }
      ctx.restore();
    }
    if (elapsed < duration) requestAnimationFrame(frame);
    else canvas.remove();
  };
  requestAnimationFrame(frame);
}
function playNotes(notes, wave = 'sine', length = 0.35, volume = 0.16) {
  if (!state.game.sound) return;
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    audioCtx = audioCtx || new AudioCtx();
    const now = audioCtx.currentTime;
    notes.forEach(([freq, delay]) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = wave;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, now + delay);
      gain.gain.exponentialRampToValueAtTime(volume, now + delay + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + delay + length);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + delay);
      osc.stop(now + delay + length + 0.05);
    });
  } catch (e) {
    /* audio tidak tersedia */
  }
}
function playChime() {
  playNotes([[784, 0], [1047, 0.12], [1319, 0.24]]);
}
function playTone(correct) {
  if (correct) playNotes([[660, 0], [880, 0.09]], 'sine', 0.22, 0.14);
  else playNotes([[330, 0], [247, 0.13]], 'triangle', 0.25, 0.14);
}

function ring(frac, color, size = 170, stroke = 16) {
  const c = size / 2;
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const f = clamp(frac, 0, 1);
  const arc = f > 0
    ? `<circle cx="${c}" cy="${c}" r="${r}" fill="none" style="stroke:${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(circ * f).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 ${c} ${c})"/>`
    : '';
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="ring-bg" cx="${c}" cy="${c}" r="${r}" fill="none" stroke-width="${stroke}"/>${arc}</svg>`;
}

function bmiGauge(bmi, std = bmiStd()) {
  const lo = 15;
  const hi = 40;
  let prev = lo;
  const segs = std.cats.map(cat => {
    const end = Math.min(cat.upTo, hi);
    const width = end - prev;
    prev = Math.max(prev, end);
    return width > 0 ? `<span style="flex:${width};background:${cat.color}" title="${esc(cat.label)}"></span>` : '';
  }).join('');
  const pos = clamp((bmi - lo) / (hi - lo), 0, 1) * 100;
  return `<div class="gauge"><div class="gauge-bar">${segs}</div><div class="gauge-marker" style="left:${pos.toFixed(1)}%"></div></div>
    <div class="gauge-scale"><span>15</span><span>BMI</span><span>40</span></div>`;
}

function calorieChart(rows, target) {
  const W = compact ? 360 : 680;
  const H = compact ? 220 : 260;
  const pl = 44;
  const pr = 10;
  const pt = 16;
  const pb = 28;
  const maxV = Math.max(target * 1.2, ...rows.map(r => r.kcal), 500);
  const step = maxV > 3200 ? 1000 : 500;
  const yMax = Math.ceil(maxV / step) * step;
  const iw = W - pl - pr;
  const ih = H - pt - pb;
  const n = rows.length;
  const bw = iw / n;
  const y = v => pt + ih * (1 - v / yMax);
  const labelEvery = n <= 7 ? 1 : Math.ceil(n / (compact ? 5 : 8));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik kalori harian">`;
  for (let v = 0; v <= yMax; v += step) {
    s += `<line class="grid-line" x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`;
    s += `<text class="axis" x="${pl - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;
  }
  rows.forEach((r, i) => {
    const x = pl + i * bw + bw * 0.18;
    const w = bw * 0.64;
    if (r.kcal > 0) {
      const ratio = r.kcal / r.budget;
      const cls = ratio > 1.1 ? 'bar-over' : ratio > 1.0 ? 'bar-warn' : 'bar-ok';
      const top = y(r.kcal);
      s += `<rect class="${cls}" x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${(y(0) - top).toFixed(1)}" rx="${Math.min(4, w / 3).toFixed(1)}"><title>${esc(shortDate(r.k))}: ${fmt(r.kcal)} kkal</title></rect>`;
    } else {
      s += `<rect class="bar-empty" x="${x.toFixed(1)}" y="${(y(0) - 2).toFixed(1)}" width="${w.toFixed(1)}" height="2"/>`;
    }
    if ((n - 1 - i) % labelEvery === 0) {
      s += `<text class="axis" x="${(x + w / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${esc(n <= 7 ? dayName(r.k) : shortDate(r.k))}</text>`;
    }
  });
  const ty = y(target);
  s += `<line class="target-line" x1="${pl}" x2="${W - pr}" y1="${ty.toFixed(1)}" y2="${ty.toFixed(1)}"/>`;
  s += `<text class="axis strong" x="${W - pr}" y="${(ty - 6).toFixed(1)}" text-anchor="end">Target ${fmt(target)}</text>`;
  return s + '</svg>';
}

function weightChart(ws, goal) {
  if (!ws.length) return '<div class="empty">Belum ada data berat.</div>';
  const W = compact ? 360 : 680;
  const H = compact ? 220 : 280;
  const pl = 40;
  const pr = 14;
  const pt = 22;
  const pb = 28;
  const first = ws[0].date;
  const last = ws[ws.length - 1].date;
  const span = Math.max(1, daysBetween(first, last));
  const vals = ws.map(w => w.kg);
  if (goal > 0) vals.push(goal);
  let lo = Math.floor(Math.min(...vals) - 1);
  let hi = Math.ceil(Math.max(...vals) + 1);
  const range = hi - lo;
  const step = range <= 6 ? 1 : range <= 12 ? 2 : range <= 30 ? 5 : 10;
  lo = Math.floor(lo / step) * step;
  hi = Math.ceil(hi / step) * step;
  const iw = W - pl - pr;
  const ih = H - pt - pb;
  const x = d => pl + (ws.length === 1 ? iw / 2 : iw * daysBetween(first, d) / span);
  const y = v => pt + ih * (1 - (v - lo) / (hi - lo));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik berat badan">`;
  for (let v = lo; v <= hi + 1e-9; v += step) {
    s += `<line class="grid-line" x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`;
    s += `<text class="axis" x="${pl - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`;
  }
  if (goal > 0) {
    s += `<line class="goal-line" x1="${pl}" x2="${W - pr}" y1="${y(goal).toFixed(1)}" y2="${y(goal).toFixed(1)}"/>`;
    s += `<text class="axis goal-label" x="${W - pr}" y="${(y(goal) - 6).toFixed(1)}" text-anchor="end">Target ${fmtMax(goal, 1)} kg</text>`;
  }
  const pts = ws.map(w => [x(w.date), y(w.kg)]);
  if (pts.length > 1) {
    const line = pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const base = y(lo).toFixed(1);
    s += `<polygon class="w-area" points="${pts[0][0].toFixed(1)},${base} ${line} ${pts[pts.length - 1][0].toFixed(1)},${base}"/>`;
    s += `<polyline class="w-line" points="${line}"/>`;
  }
  const radius = ws.length > 40 ? 2.5 : 4;
  ws.forEach((w, i) => {
    s += `<circle class="w-dot" cx="${pts[i][0].toFixed(1)}" cy="${pts[i][1].toFixed(1)}" r="${radius}"><title>${esc(shortDate(w.date))}: ${fmtMax(w.kg, 1)} kg</title></circle>`;
  });
  const lp = pts[pts.length - 1];
  s += `<text class="axis strong" x="${lp[0].toFixed(1)}" y="${(lp[1] - 10).toFixed(1)}" text-anchor="${ws.length > 1 ? 'end' : 'middle'}">${fmtMax(ws[ws.length - 1].kg, 1)} kg</text>`;
  s += `<text class="axis" x="${pl}" y="${H - 8}" text-anchor="start">${esc(shortDate(first))}</text>`;
  if (ws.length > 1) s += `<text class="axis" x="${W - pr}" y="${H - 8}" text-anchor="end">${esc(shortDate(last))}</text>`;
  return s + '</svg>';
}

function viewWeight() {
  const p = state.profile;
  const ws = sortedWeights();
  const std = bmiStd();
  const today = todayKey();
  const cur = currentWeight();
  const start = startWeight();
  const goal = p.goalWeight;
  const bmi = bmiOf(cur);
  const cat = bmiCategory(bmi, std);
  const h2 = Math.pow(p.heightCm / 100, 2);
  const normalLo = std.normal[0] * h2;
  const normalHi = std.normal[1] * h2;
  const totalDelta = start - goal;
  const progress = Math.abs(totalDelta) < 0.05 ? 100 : clamp((start - cur) / totalDelta * 100, 0, 100);
  const remain = cur - goal;
  const t = computeTargets(today);
  const trend = weightTrend();
  let etaPlan = '—';
  let etaTrend = '—';
  if (t.mode === 'maintain') {
    etaPlan = 'target tercapai 🎉';
  } else if (Math.abs(t.kgPerWeek) > 0.01) {
    const weeks = Math.abs(remain) / Math.abs(t.kgPerWeek);
    etaPlan = `±${fmt(weeks)} minggu (${esc(monthYear(addDays(today, Math.round(weeks * 7))))})`;
  }
  if (trend && Math.abs(remain) >= 0.5 && Math.sign(trend.perWeek) === Math.sign(-remain) && Math.abs(trend.perWeek) >= 0.05) {
    const weeks = Math.abs(remain) / Math.abs(trend.perWeek);
    etaTrend = `±${fmt(weeks)} minggu (${esc(monthYear(addDays(today, Math.round(weeks * 7))))})`;
  }
  const lastWaist = ws.slice().reverse().find(w => w.waist);
  const waistLimit = p.sex === 'female' ? 80 : 90;
  const goodDir = goal < start ? -1 : 1;
  const changeClass = v => (Math.abs(v) < 0.05 ? '' : Math.sign(v) === goodDir ? 'text-ok' : 'text-danger');
  const desc = ws.slice().reverse();
  const history = desc.length
    ? `<div class="table-wrap"><table class="tbl">
        <thead><tr><th>Tanggal</th><th class="num">Berat</th><th class="num">Perubahan</th><th class="num">BMI</th><th class="num">Lingkar perut</th><th></th></tr></thead>
        <tbody>${desc.map((w, i) => {
          const prev = desc[i + 1];
          const diff = prev ? w.kg - prev.kg : null;
          return `<tr>
            <td>${esc(longDate(w.date))}</td>
            <td class="num"><b>${fmtMax(w.kg, 1)} kg</b></td>
            <td class="num ${diff == null ? '' : changeClass(diff)}">${diff == null ? '—' : fmtSigned(diff, 1) + ' kg'}</td>
            <td class="num">${fmtMax(bmiOf(w.kg), 1)}</td>
            <td class="num">${w.waist ? fmtMax(w.waist, 1) + ' cm' : '—'}</td>
            <td class="num"><button type="button" class="x-btn" data-action="delWeight" data-id="${esc(w.id)}" aria-label="Hapus">×</button></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`
    : '<div class="empty">Belum ada data berat.</div>';
  const waistInfo = lastWaist
    ? `<p class="small">Lingkar perut terakhir <b>${fmtMax(lastWaist.waist, 1)} cm</b> ${lastWaist.waist > waistLimit
      ? `<span class="tag" style="background:var(--danger)">&gt; ${waistLimit} cm · obesitas sentral</span>`
      : `<span class="tag" style="background:var(--ok)">≤ ${waistLimit} cm</span>`}</p>`
    : '';
  return `
  <div class="page-title">
    <div><h1>Berat badan</h1><p>Pantau tren berat, BMI &amp; lingkar perut.</p></div>
    <span class="pill">${fmtMax(cur, 1)} kg · BMI ${fmtMax(bmi, 1)}</span>
  </div>
  <div class="grid two">
    <div class="card">
      <h3>Catat berat badan</h3>
      <form class="form" data-form="addWeight">
        <div class="form-grid">
          <label class="field">Tanggal<input type="date" name="date" value="${ui.date}" max="${today}" required></label>
          <label class="field">Berat (kg)<input name="kg" inputmode="decimal" placeholder="mis. ${fmtInput(cur)}" required autocomplete="off"></label>
        </div>
        <label class="field">Lingkar perut (cm) — opsional<input name="waist" inputmode="decimal" placeholder="ukur melingkar sejajar pusar" autocomplete="off"></label>
        <button class="btn primary">💾 Simpan berat</button>
      </form>
      <p class="small muted">Tips: timbang 1x seminggu di hari &amp; jam yang sama — pagi, setelah ke toilet, sebelum makan. Naik-turun ±1 kg per hari itu normal (cairan &amp; isi pencernaan); perhatikan trennya.</p>
    </div>
    <div class="card">
      <h3>Progres menuju target</h3>
      <div class="stats3">
        <div class="stat"><div class="l">Awal</div><div class="v">${fmtMax(start, 1)} <small>kg</small></div></div>
        <div class="stat"><div class="l">Sekarang</div><div class="v">${fmtMax(cur, 1)} <small>kg</small></div></div>
        <div class="stat"><div class="l">Target</div><div class="v">${fmtMax(goal, 1)} <small>kg</small></div></div>
      </div>
      <div class="metric mt">
        <div class="top"><span>Perubahan <b class="${changeClass(cur - start)}">${fmtSigned(cur - start, 1)} kg</b> · sisa ${fmtMax(Math.abs(remain), 1)} kg</span><span>${fmt(progress)}%</span></div>
        <div class="bar"><span style="width:${progress}%"></span></div>
      </div>
      <table class="kv">
        <tr><td>Tren 4 minggu terakhir</td><td>${trend ? fmtSigned(trend.perWeek, 2) + ' kg/minggu' : '<span class="muted">butuh data ≥ 6 hari</span>'}</td></tr>
        <tr><td>Estimasi sesuai rencana</td><td>${etaPlan}</td></tr>
        <tr><td>Estimasi dari tren</td><td>${etaTrend}</td></tr>
      </table>
      <div class="sep"></div>
      <div class="row between wrap">
        <div><div class="small muted">BMI · standar ${esc(std.label)}</div><div class="big-num">${fmtMax(bmi, 1)}</div></div>
        <span class="tag" style="background:${cat.color}">${esc(cat.label)}</span>
      </div>
      ${bmiGauge(bmi, std)}
      <p class="small muted">Berat normal untuk tinggi ${fmtMax(p.heightCm, 1)} cm: <b>${fmtMax(normalLo, 1)}–${fmtMax(normalHi, 1)} kg</b>.</p>
      ${waistInfo}
    </div>
  </div>
  <div class="card"><div class="card-head"><h3>📈 Grafik berat badan</h3><span class="muted small">${ws.length} data</span></div>${weightChart(ws, goal)}</div>
  <div class="card"><h3>Riwayat</h3>${history}</div>`;
}

function viewStats() {
  const p = state.profile;
  const n = ui.statsRange;
  const end = ui.date;
  const keys = Array.from({ length: n }, (_, i) => addDays(end, i - n + 1));
  const t = computeTargets(end);
  const rows = keys.map(k => {
    const tot = dayTotals(k);
    return { k, ...tot, budget: t.kcal + tot.burned * p.exerciseCredit };
  });
  const logged = rows.filter(r => r.foodCount > 0);
  const avg = (arr, f) => (arr.length ? arr.reduce((s, r) => s + f(r), 0) / arr.length : 0);
  const avgKcal = avg(logged, r => r.kcal);
  const avgProtein = avg(logged, r => r.protein);
  const onTarget = logged.filter(r => r.kcal >= r.budget * 0.8 && r.kcal <= r.budget * 1.05).length;
  const waterDays = rows.filter(r => r.water > 0);
  const stepDays = rows.filter(r => r.steps != null);
  const sleepDays = rows.filter(r => r.sleepH != null);
  const exMin = rows.reduce((s, r) => s + r.exMin, 0);
  const burned = rows.reduce((s, r) => s + r.burned, 0);
  const deficit = logged.reduce((s, r) => s + (t.tdee + r.burned - r.kcal), 0);
  const wIn = sortedWeights().filter(w => w.date >= keys[0] && w.date <= end);
  const wChange = wIn.length >= 2 ? wIn[wIn.length - 1].kg - wIn[0].kg : null;
  const eP = logged.reduce((s, r) => s + r.protein * 4, 0);
  const eC = logged.reduce((s, r) => s + r.carbs * 4, 0);
  const eF = logged.reduce((s, r) => s + r.fat * 9, 0);
  const eT = eP + eC + eF;
  const pct = v => (eT > 0 ? v / eT * 100 : 0);
  const agg = {};
  keys.forEach(k => getDay(k).foods.forEach(f => {
    const a = agg[f.name] || (agg[f.name] = { name: f.name, kcal: 0, count: 0 });
    a.kcal += f.kcal * f.qty;
    a.count += 1;
  }));
  const top = Object.values(agg).sort((a, b) => b.kcal - a.kcal).slice(0, 6);
  const totalKcal = logged.reduce((s, r) => s + r.kcal, 0);
  const tile = (label, value, sub) => `<div class="stat"><div class="l">${label}</div><div class="v">${value}</div><div class="tiny muted">${sub}</div></div>`;
  const macroBlock = eT > 0
    ? `<div class="stack"><span style="width:${pct(eP)}%;background:var(--protein)"></span><span style="width:${pct(eC)}%;background:var(--carbs)"></span><span style="width:${pct(eF)}%;background:var(--fat)"></span></div>
      <div class="legend">
        <span><i class="dot" style="background:var(--protein)"></i>Protein ${fmt(pct(eP))}%</span>
        <span><i class="dot" style="background:var(--carbs)"></i>Karbohidrat ${fmt(pct(eC))}%</span>
        <span><i class="dot" style="background:var(--fat)"></i>Lemak ${fmt(pct(eF))}%</span>
      </div>
      <p class="tiny muted">Acuan umum (AMDR): protein 10–35%, karbohidrat 45–65%, lemak 20–35% dari total energi.</p>`
    : '<div class="empty">Belum ada data makanan di periode ini.</div>';
  const topBlock = top.length
    ? top.map(f => `
      <div class="metric">
        <div class="top small"><span>${esc(f.name)} <span class="muted">· ${f.count}x</span></span><span><b>${fmt(f.kcal)}</b> kkal</span></div>

const WEEKDAY_SHORT = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
const LABEL_POS = { n: [0, -16, 'middle'], s: [0, 30, 'middle'], e: [13, 6, 'start'], w: [-13, 6, 'end'] };
const mapPoint = (lon, lat) => [18 + (lon - 94.5) * 20.6, 12 + (7 - lat) * 20.6];
const svgPath = pts => pts.map(([x, y], i) => `${i ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join(' ');

function bossCardHtml(stats) {
  const today = todayKey();
  const week = stats.week;
  const boss = week.boss;
  const hpLeft = Math.max(0, boss.hp - week.dmg);
  const hpPct = clamp(hpLeft / boss.hp * 100, 0, 100);
  const dead = Boolean(week.wonOn);
  const mood = dead ? 'dead' : hpPct > 66 ? 'fresh' : hpPct > 33 ? 'hurt' : 'weak';
  const hits = stats.todayHits;
  const lastDay = addDays(week.k, 6);
  const daysLeft = daysBetween(today, lastDay);
  const strip = WEEKDAY_SHORT.map((label, i) => {
    const k = addDays(week.k, i);
    const future = k > today;
    const dmg = week.days[k] || 0;
    const cls = [future ? 'future' : '', dmg > 0 ? 'hit' : '', k === today ? 'today' : ''].join(' ');
    return `<div class="wd ${cls}" title="${esc(longDate(k))}">${label}<b>${future ? '–' : fmt(dmg)}</b></div>`;
  }).join('');
  const weakness = boss.weak.map(id => {
    const h = BOSS_HITS.find(x => x.id === id);
    return `${h.icon} ${esc(h.label)}`;
  }).join(' · ');
  const chips = hits.list.length
    ? hits.list.map(h => `<span class="hit-chip ${h.crit ? 'crit' : ''}">${h.icon} ${esc(h.label)} −${h.dmg}${h.crit ? ' · KRITIS!' : ''}</span>`).join('')
    : '<span class="tiny muted">Belum ada serangan hari ini — catat makanan untuk mulai menyerang! ⚔️</span>';
  const nextBoss = bossOfWeek(addDays(week.k, 7));
  const status = dead
    ? `<div class="quiz-result ok">🏆 <b>${esc(boss.name)}</b> kalah pada ${esc(longDate(week.wonOn))}! +${BOSS_XP} XP sudah masuk. Minggu depan giliran ${nextBoss.emoji} <b>${esc(nextBoss.name)}</b>.</div>`
    : `<p class="tiny muted mt">⚔️ Setiap kebiasaan sehat = serangan; kelemahan boss kena damage ×2. Boss kabur Minggu tengah malam — ${daysLeft === 0 ? 'hari ini kesempatan terakhir!' : `sisa ${daysLeft} hari`}.</p>`;
  const trophies = BOSSES.map(b => {
    const n = stats.trophies[b.id] || 0;
    return `<span class="trophy ${n ? '' : 'none'}" title="${esc(b.name)}">${b.emoji} ×${n}</span>`;
  }).join('');
  return `
  <div class="card">
    <div class="card-head"><h3>👹 Boss Mingguan</h3><span class="pill">${esc(shortDate(week.k))} – ${esc(shortDate(lastDay))}</span></div>
    <div class="boss-stage">
      <div class="boss-emoji ${dead ? 'dead' : hits.total > 0 ? 'hit' : ''}">${boss.emoji}${dead ? '<span class="ko">K.O.</span>' : ''}</div>
      <div>
        <div class="boss-name">${esc(boss.name)}</div>
        <div class="boss-desc">${esc(boss.desc)}</div>
        <div class="hp-bar big mt"><span style="width:${hpPct}%"></span></div>
        <div class="row between wrap small mt-s"><b>HP ${fmt(hpLeft)} / ${fmt(boss.hp)}</b><span class="muted">damage minggu ini ${fmt(week.dmg)}</span></div>
      </div>
    </div>
    <div class="boss-taunt">${boss.emoji} “${esc(boss.lines[mood])}”</div>
    <div class="small mt"><b>Kelemahan (damage ×2):</b> ${weakness}</div>
    <div class="week-strip">${strip}</div>
    <div class="small mt"><b>Serangan hari ini: ${fmt(hits.total)}</b></div>
    <div class="hits">${chips}</div>
    ${status}
    <div class="small mt"><b>Koleksi trofi boss</b></div>

}

// Tebak Kalori: pasangan makanan acak, makin panjang skor makin tipis selisihnya
function newQuizRound(streak) {
  const minRatio = streak < 3 ? 1.6 : streak < 7 ? 1.35 : 1.2;
  let pair = null;
  for (let tries = 0; tries < 400 && !pair; tries++) {
    const a = FOOD_DB[Math.floor(Math.random() * FOOD_DB.length)];
    const b = FOOD_DB[Math.floor(Math.random() * FOOD_DB.length)];
    if (a === b) continue;
    const hi = Math.max(a.kcal, b.kcal);
    const lo = Math.min(a.kcal, b.kcal);
    if (hi - lo >= 25 && hi >= lo * minRatio) pair = [a, b];
  }
  if (!pair) pair = [FOOD_DB[0], FOOD_DB[FOOD_DB.length - 1]];
  return { a: pair[0], b: pair[1], mode: Math.random() < 0.7 ? 'higher' : 'lower', pick: null, correct: false, note: '' };
}
const quizWinner = r => ((r.mode === 'higher') === (r.a.kcal > r.b.kcal) ? 'a' : 'b');
function ensureQuiz() {
  if (!ui.quiz) ui.quiz = { streak: 0, lastStreak: 0, xpGain: 0, newBest: false, round: newQuizRound(0) };
  return ui.quiz;
}
function quizCardInner() {
  const q = ensureQuiz();
  const r = q.round;
  const g = state.game.quiz;
  const today = todayKey();
  const dayXp = g.day === today ? g.dayXp : 0;
  const answered = r.pick !== null;
  const winner = quizWinner(r);
  const option = (key, f) => {
    const cls = !answered ? '' : key === winner ? 'right' : key === r.pick ? 'wrong' : '';
    return `<button type="button" class="quiz-opt ${cls}" data-action="quizPick" data-pick="${key}" ${answered ? 'disabled' : ''}>
      <span class="q-emoji">${foodEmoji(f)}</span>
      <span class="q-name">${esc(f.name)}</span>
      <span class="q-portion">${esc(f.portion)}</span>
      ${answered ? `<span class="q-kcal">${fmt(f.kcal)} kkal</span>` : ''}
    </button>`;
  };
  let result = '';
  if (answered) {
    const diff = Math.abs(r.a.kcal - r.b.kcal);
    const gap = `Selisihnya ${fmt(diff)} kkal ≈ ${fmt(walkMinutes(diff, today))} menit jalan cepat.`;
    result = r.correct
      ? `<div class="quiz-result ok"><b>${esc(r.note)}</b> ${gap}${q.xpGain ? ` <b>+${q.xpGain} XP</b>` : ''}${q.newBest ? ' 🏆 <b>Rekor baru!</b>' : ''}</div>
        <div class="modal-actions mt"><button type="button" class="btn primary" data-action="quizNext">Lanjut →</button></div>`
      : `<div class="quiz-result bad"><b>${esc(r.note)}</b> ${gap} Skor beruntunmu tadi: <b>${q.lastStreak}</b>.</div>
        <div class="modal-actions mt"><button type="button" class="btn primary" data-action="quizNext">Main lagi 🔄</button></div>`;
  }
  return `
    <div class="card-head"><h3>🧠 Tebak Kalori</h3><span class="pill">🏆 Rekor ${fmt(g.best)}</span></div>
    <div class="quiz-q">Mana yang kalorinya <span class="mode ${r.mode}">${r.mode === 'higher' ? '▲ LEBIH TINGGI' : '▼ LEBIH RENDAH'}</span>?</div>
    <div class="quiz-pair">${option('a', r.a)}${option('b', r.b)}<span class="quiz-vs">VS</span></div>
    ${result}
    <div class="quiz-foot"><span>🔥 Beruntun: <b>${q.streak}</b></span><span>XP kuis hari ini: ${dayXp}/${QUIZ_XP_CAP}</span></div>`;
}
function renderQuizCard() {
  const card = $('#quizCard');
  if (card) card.innerHTML = quizCardInner();
}

function journeyMap(trip) {
  if (!mapLandCache) {
    mapLandCache = MAP_ISLANDS.map(flat => {
      const pts = [];
      for (let i = 0; i < flat.length; i += 2) pts.push(mapPoint(flat[i], flat[i + 1]));
      return `<path class="map-land" d="${svgPath(pts)} Z"/>`;
    }).join('');
  }
  const pts = CITIES.map(c => mapPoint(c.lon, c.lat));
  const along = (CITIES.length - 1) * trip.pct / 100;
  const seg = Math.min(CITIES.length - 2, Math.floor(along));
  const t = clamp(along - seg, 0, 1);
  const me = [pts[seg][0] + (pts[seg + 1][0] - pts[seg][0]) * t, pts[seg][1] + (pts[seg + 1][1] - pts[seg][1]) * t];
  const done = pts.slice(0, seg + 1).concat([me]);
  const cities = CITIES.map((c, i) => {
    const [x, y] = pts[i];
    const reached = i <= trip.stop;
    const cls = reached ? 'done' : i === trip.stop + 1 ? 'next' : '';
    const [dx, dy, anchor] = LABEL_POS[c.pos];
    return `<circle class="map-city ${cls}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7"><title>${esc(c.name)}</title></circle>`
      + `<text class="map-label ${reached ? 'done' : ''}" x="${(x + dx).toFixed(1)}" y="${(y + dy).toFixed(1)}" text-anchor="${anchor}">${esc(c.name)}</text>`;
  }).join('');
  const svg = `<svg viewBox="0 0 1000 400" role="img" aria-label="Peta perjalanan Sabang–Merauke, posisi sekarang ${esc(CITIES[trip.stop].name)}">
    <rect class="map-sea" x="0" y="0" width="1000" height="400" rx="16"/>
    ${mapLandCache}
    <path class="map-route" d="${svgPath(pts)}"/>
    <path class="map-done" d="${svgPath(done)}"/>

/* =========================================================
   HADIAH LEVEL: PETI, STIKER, AKSESORI & TEMA
   ========================================================= */
// Peti dari Level 2 sampai level sekarang: 1 tiap naik level + peti spesial tiap kelipatan 10
function chestList(level) {
  const list = [];
  for (let L = 2; L <= level; L++) {
    list.push({ level: L, type: 'normal' });
    if (L % 10 === 0) list.push({ level: L, type: L === 10 ? 'gold' : 'legend' });
  }
  return list;
}
function chestsWaiting(level = getStats().level.level) {
  return Math.max(0, chestList(level).length - state.game.rewards.opened);
}
const decadeTrophy = L => DECADE_TROPHIES[(L / 10 - 4) % DECADE_TROPHIES.length];
function rewardsAt(L) {
  const items = [];
  if (L >= 2) items.push({ icon: '🎁', text: 'Peti Harta', chest: true });
  if (L >= 10 && L % 10 === 0) items.push({ icon: L === 10 ? '🎁' : '💎', text: L === 10 ? 'Peti Emas' : 'Peti Legendaris', chest: true });
  OUTFITS.filter(o => o.id && o.level === L).forEach(o => items.push({ icon: o.emoji, text: o.name }));
  THEMES.filter(t => t.level === L && t.level > 1).forEach(t => items.push({ icon: '🎨', text: 'Tema ' + t.name }));
  PET_SPECIES.filter(s => s.level === L && L > 1).forEach(s => items.push({ icon: '🐾', text: 'Pet ' + s.name }));
  PET_STAGES.filter(s => s.level === L && L > 1).forEach(s => items.push({ icon: '🌱', text: 'Pet tumbuh: ' + s.name }));
  if (L >= 40 && L % 10 === 0) items.push({ icon: decadeTrophy(L), text: `Piala Level ${L}` });
  return items;
}
function rewardSummary(from, to) {
  let chests = 0;
  const extras = [];
  for (let L = Math.max(2, from + 1); L <= to; L++) {
    for (const item of rewardsAt(L)) {
      if (item.chest) chests += 1;
      else extras.push(`${item.icon} ${item.text}`);
    }
  }
  return (chests ? [`🎁 ${chests} peti`] : []).concat(extras).slice(0, 6).join(' · ');
}
// Isi peti ditentukan dari urutan peti + tanggal mulai, jadi sama di semua perangkat
function rollSticker(seedText, table) {
  const rand = seededRandom(hashString(seedText + '|' + state.createdAt));
  let roll = rand();
  let rarity = table[table.length - 1][0];
  for (const [name, chance] of table) {
    if (roll < chance) {
      rarity = name;
      break;
    }
    roll -= chance;
  }
  const pool = STICKERS.filter(s => s.rarity === rarity);
  return pool[Math.floor(rand() * pool.length)];
}
function openChest() {
  const r = state.game.rewards;
  const list = chestList(getStats().level.level);
  if (r.opened >= list.length) return null;
  const chest = list[r.opened];
  const sticker = rollSticker('peti|' + r.opened, RARITY_ROLL[chest.type]);
  const duplicate = Boolean(r.stickers[sticker.id]);
  r.stickers[sticker.id] = (r.stickers[sticker.id] || 0) + 1;
  if (duplicate) r.stars += RARITY[sticker.rarity].stars;
  r.opened += 1;
  save();
  return { chest, sticker, duplicate };
}
function redeemStars() {
  const r = state.game.rewards;
  const missing = STICKERS.filter(s => !r.stickers[s.id]);
  const pool = missing.filter(s => s.rarity !== 'legendaris').length ? missing.filter(s => s.rarity !== 'legendaris') : missing;
  if (r.stars < STAR_COST || !pool.length) return null;
  const sticker = pool[Math.floor(seededRandom(hashString('tukar|' + r.redeemed + '|' + state.createdAt))() * pool.length)];
  r.stars -= STAR_COST;
  r.redeemed += 1;
  r.stickers[sticker.id] = 1;
  save();
  return sticker;
}
function equippedOutfit() {
  const outfit = OUTFITS.find(o => o.id && o.id === state.game.rewards.outfit);
  return outfit && getStats().level.level >= outfit.level ? outfit : null;
}
function mascotFigure() {
  const outfit = equippedOutfit();
  return `<span class="mascot-body">${outfit ? `<span class="mascot-acc">${outfit.emoji}</span>` : ''}<span class="mascot-emoji">🥦</span></span>`;
}
function applyTheme() {
  const level = getStats().level.level;
  const chosen = THEMES.find(t => t.id === state.game.rewards.theme);
  const theme = chosen && chosen.level <= level ? chosen : THEMES[0];
  if (theme.id === 'hijau') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme.id;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.content = theme.color;
}
function rewardsCardHtml(level) {
  const r = state.game.rewards;
  const waiting = chestsWaiting(level);
  const next = chestList(level)[r.opened];
  const xp = getStats().xp;
  const toNext = Math.max(0, 50 * (level + 1) * level - xp);
  const start = Math.max(2, level - 1);
  const nodes = [];
  for (let L = start; L <= level + 11; L++) {
    const icons = rewardsAt(L).map(item => item.icon).join(' ');
    const cls = [L <= level ? 'done' : '', L === level + 1 ? 'current' : '', L % 10 === 0 ? 'big' : ''].join(' ');
    nodes.push(`<div class="track-node ${cls}" title="${esc(rewardsAt(L).map(item => item.text).join(', '))}">
      <div class="tn-level">Lv ${L}</div><div class="tn-icons">${icons}</div><div class="tn-state">${L <= level ? '✓ didapat' : L === level + 1 ? `${fmt(toNext)} XP lagi` : '🔒'}</div></div>`);
  }
  const bigLevel = Math.floor(level / 10) * 10 + 10;
  const bigNeed = Math.max(0, 50 * bigLevel * (bigLevel - 1) - xp);
  const bigList = rewardsAt(bigLevel).map(item => `${item.icon} ${esc(item.text)}`).join(', ');
  return `
  <div class="card">
    <div class="card-head"><h3>🎁 Hadiah Level</h3><span class="pill">${STICKERS.filter(s => r.stickers[s.id]).length}/${STICKERS.length} stiker</span></div>
    <div class="chest-row">
      <div class="chest-icon ${waiting ? 'ready' : ''}">🎁${waiting ? `<span class="chest-count">${waiting}</span>` : ''}</div>
      <div>
        <b>${waiting ? `${waiting} peti siap dibuka!` : r.opened ? 'Semua peti sudah dibuka' : 'Belum ada peti'}</b>
        <div class="small muted">${waiting ? `Berikutnya: ${CHEST_LABEL[next.type]} dari Level ${next.level}` : `Naik ke Level ${level + 1} untuk peti berikutnya — ${fmt(toNext)} XP lagi`}</div>
      </div>
      ${waiting ? '<button type="button" class="btn primary" data-action="openChest">Buka peti 🎁</button>' : ''}
    </div>
    <div class="track">${nodes.join('')}</div>
    <div class="next-big">🏆 <b>Hadiah besar Level ${bigLevel}:</b> ${bigList}. <span class="muted">${fmt(bigNeed)} XP lagi.</span></div>
  </div>`;
}
function wardrobeCardHtml(level) {
  const r = state.game.rewards;
  const outfits = OUTFITS.map(o => {
    const open = level >= o.level;
    const active = (r.outfit || '') === o.id;
    return `<button type="button" class="wear ${active ? 'active' : ''} ${open ? '' : 'locked'}" data-action="wear" data-id="${o.id}">
      <span class="wear-ico">${o.emoji || '🥦'}</span><span class="wear-name">${esc(o.name)}</span>
      <span class="wear-lv">${open ? (active ? 'Dipakai' : 'Pakai') : `🔒 Lv ${o.level}`}</span></button>`;
  }).join('');
  const themes = THEMES.map(t => {
    const open = level >= t.level;
    const active = (r.theme || 'hijau') === t.id;
    return `<button type="button" class="theme-opt ${active ? 'active' : ''} ${open ? '' : 'locked'}" data-action="useTheme" data-id="${t.id}">
      <span class="t-swatch" style="background:${t.color}"></span><span class="t-name">${esc(t.name)}</span>
      <span class="t-lv">${open ? (active ? 'Dipakai' : 'Pakai') : `🔒 Lv ${t.level}`}</span></button>`;
  }).join('');
  return `
  <div class="card">
    <div class="card-head"><h3>🎽 Lemari Bro Koli</h3><span class="mascot-preview">${mascotFigure()}</span></div>
    <div class="wardrobe">${outfits}</div>
    <div class="card-head mt"><h3>🎨 Tema warna</h3></div>
    <div class="theme-list">${themes}</div>
  </div>`;
}
function albumCardHtml() {
  const r = state.game.rewards;
  const owned = STICKERS.filter(s => r.stickers[s.id]).length;
  const canRedeem = r.stars >= STAR_COST && owned < STICKERS.length;
  const cells = STICKERS.map(s => {
    const n = r.stickers[s.id] || 0;
    return n
      ? `<button type="button" class="sticker r-${s.rarity}" data-action="stickerInfo" data-id="${s.id}" title="${esc(s.line)}"><span class="st-emoji">${s.emoji}</span><span class="st-name">${esc(s.name)}</span>${n > 1 ? `<span class="st-count">×${n}</span>` : ''}</button>`
      : `<div class="sticker missing r-${s.rarity}" title="Belum punya · ${RARITY[s.rarity].label}"><span class="st-emoji">❔</span><span class="st-name">${RARITY[s.rarity].label}</span></div>`;
  }).join('');
  return `
  <div class="card">
    <div class="card-head"><h3>📒 Album Stiker Nusantara</h3><span class="pill">${owned}/${STICKERS.length}</span></div>
    <div class="album">${cells}</div>
    <div class="row between wrap mt small">
      <span>⭐ <b>${r.stars}</b> bintang <span class="muted">(dari stiker dobel)</span></span>
      <button type="button" class="btn small" data-action="redeemStars" ${canRedeem ? '' : 'disabled'}>Tukar ${STAR_COST} ⭐ → stiker baru</button>
    </div>
    <p class="tiny muted">Ketuk stiker untuk membaca ceritanya. Stiker dobel jadi bintang: Biasa 1 · Langka 2 · Epik 4 · Legendaris 8.</p>
  </div>`;
}
function openChestModal() {
  const result = openChest();
  if (!result) return toast('Belum ada peti untuk dibuka');

  function render(id, opts = {}) {
    const sp = { ...base, ...(species[id] || species.oyen) };
    const c = { body: sp.body, belly: sp.belly };
    const stage = opts.stage || 'remaja';
    const mood = opts.mood || 'senang';
    const scale = { bayi: 0.8, remaja: 0.91, dewasa: 1, legenda: 1 }[stage] || 1;
    const [hx, hy, hrx, hry] = sp.head;

    if (stage === 'legenda') svg += ci(60, 64, 52, '#ffd56b', 'opacity=".16"') + ci(60, 64, 42, '#ffd56b', 'opacity=".2"');

    svg += el(60, 93, brx, bry, sp.belly, sp.bellyStroke ? S : '');
    if (sp.bellyLines) svg += sp.bellyLines(c);

    svg += el(46, 106, 9, 5.5, sp.feet || limbs, S) + el(74, 106, 9, 5.5, sp.feet || limbs, S);
    if (sp.arms) svg += el(37, 90, 6, 8.5, limbs, `${S} ${rot(22, 37, 90)}`) + el(83, 90, 6, 8.5, limbs, `${S} ${rot(-22, 83, 90)}`);
    if (sp.front) svg += sp.front(c);
    svg += el(hx, hy, hrx, hry, sp.body, S);
    if (sp.marks) svg += sp.marks(c);
    if (sp.muzzle) svg += sp.muzzle(c);
    if (sp.ears) svg += sp.ears(c);
    if (mood === 'semangat') svg += moodExtras(sp, mood);
    const [cw, chh] = sp.cheekSize || [5.5, 3.3];
    svg += sp.cheeks.map(([x, y]) => el(x, y, cw, chh, '#ff8fa3', 'opacity=".55"')).join('');

    if (sp.whiskers) svg += line('M30 63 l-9 -2 M30 67 l-9 1.5 M90 63 l9 -2 M90 67 l9 1.5', OL, 1.4, 'opacity=".55"');
    if (sp.nose) svg += sp.nose(c);
    if (sp.beak) svg += sp.beak(c);
    svg += mouthSvg(sp, mood);
    if (stage === 'dewasa' || stage === 'legenda') svg += scarf();
    svg += stageExtras(stage);
    svg += '</g></g>';
    if (mood !== 'semangat') svg += moodExtras(sp, mood);
    if (stage === 'legenda') svg += sparkles([[12, 22, 0.9], [108, 44, 0.7]]);
    const label = opts.label ? ` aria-label="${opts.label}" role="img"` : ' aria-hidden="true"';
    return `<svg class="pet-svg mood-${mood}" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"${label}>${svg}</svg>`;
